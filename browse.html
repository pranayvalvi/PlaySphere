<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Browse all free online games on PlaySphere. Filter by category and find your next favorite game instantly.">
<title>Browse Games — PlaySphere</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%237C5CFC'/%3E%3Cpath d='M35 40h10v30h-10z M55 30h10v40h-10z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #080B14;
  --surface: #0E1422;
  --card:    #111827;
  --border:  rgba(255,255,255,0.07);
  --accent:  #7C5CFC;
  --accent2: #FF6B6B;
  --accent3: #00D4AA;
  --text:    #F0F4FF;
  --muted:   #7B8DB0;
  --gold:    #FFB547;
  --radius:  18px;
  --trans:   0.2s ease;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
}

/* ── Nav ──────────────────────────────────────────────────── */
nav {
  position: fixed;
  inset-block-start: 0;
  inset-inline: 0;
  z-index: 100;
  height: 64px;
  padding: 0 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(8,11,20,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.nav-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-decoration: none;
  user-select: none;
}

.logo-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--accent);
  animation: pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%,100% { box-shadow: 0 0 12px var(--accent); transform: scale(1); }
  50%      { box-shadow: 0 0 24px var(--accent), 0 0 40px rgba(124,92,252,0.4); transform: scale(1.3); }
}

.nav-links { display: flex; gap: 4px; list-style: none; }

.nav-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 7px 16px;
  border-radius: 8px;
  transition: color var(--trans), background var(--trans);
  letter-spacing: 0.01em;
  outline-offset: 3px;
}

.nav-links a:hover { color: var(--text); background: rgba(124,92,252,0.12); }
.nav-links a.active { color: var(--accent); background: rgba(124,92,252,0.12); }
.nav-links a:focus-visible { outline: 2px solid var(--accent); }

/* ── Layout ───────────────────────────────────────────────── */
.browse-container {
  padding: 104px 40px 80px;
  max-width: 1280px;
  margin: 0 auto;
}

.browse-header { margin-bottom: 48px; }

.browse-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 5vw, 48px);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 12px;
}

.browse-sub { color: var(--muted); font-size: 16px; }

/* ── Search ───────────────────────────────────────────────── */
.search-bar {
  width: 100%;
  max-width: 400px;
  padding: 12px 16px;
  background: rgba(124,92,252,0.08);
  border: 1px solid rgba(124,92,252,0.25);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  transition: background var(--trans), border-color var(--trans), box-shadow var(--trans);
  margin-bottom: 20px;
  display: block;
}

.search-bar:focus {
  outline: none;
  background: rgba(124,92,252,0.13);
  border-color: rgba(124,92,252,0.45);
  box-shadow: 0 0 20px rgba(124,92,252,0.2);
}

.search-bar::placeholder { color: var(--muted); }

/* ── Filter Row ───────────────────────────────────────────── */
.filter-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 36px;
}

.filter-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 9px 18px;
  border-radius: 8px;
  border: 1px solid rgba(124,92,252,0.3);
  background: rgba(124,92,252,0.08);
  color: var(--text);
  transition: background var(--trans), border-color var(--trans);
  outline-offset: 3px;
}

.filter-btn.active {
  background: rgba(124,92,252,0.22);
  border-color: rgba(124,92,252,0.6);
}

.filter-btn:hover { background: rgba(124,92,252,0.18); }
.filter-btn:focus-visible { outline: 2px solid var(--accent); }

/* ── Games Grid ───────────────────────────────────────────── */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

.game-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1),
              border-color var(--trans),
              box-shadow var(--trans);
  position: relative;
}

.game-card:hover {
  transform: translateY(-6px) scale(1.01);
  border-color: rgba(124,92,252,0.35);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(124,92,252,0.15);
}

.game-card:hover .card-thumb-overlay { opacity: 1; }
.game-card:hover .play-btn { opacity: 1; transform: translate(-50%,-50%) scale(1); }

.card-thumb { aspect-ratio: 16/10; position: relative; overflow: hidden; }
.thumb-gradient { width: 100%; height: 100%; position: absolute; inset: 0; }

.card-thumb-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  opacity: 0;
  transition: opacity 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.play-btn {
  width: 52px; height: 52px;
  background: rgba(255,255,255,0.95);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translate(-50%,-50%) scale(0.7);
  position: absolute;
  top: 50%; left: 50%;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.play-btn svg { width: 20px; height: 20px; fill: var(--accent); margin-left: 3px; }

.card-badge {
  position: absolute;
  top: 12px; right: 12px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 100px;
}

.badge-hot { background: rgba(255,107,107,0.9); color: white; }
.badge-new { background: rgba(0,212,170,0.9);  color: #0A1A14; }
.badge-top { background: rgba(255,181,71,0.9);  color: #1A1000; }

.card-body { padding: 16px 18px 18px; }

.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.card-category {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.card-rating {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--gold);
  font-weight: 600;
}

.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: -0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 16px;
  font-weight: 300;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.play-now {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  background: rgba(124,92,252,0.1);
  border: 1px solid rgba(124,92,252,0.25);
  padding: 7px 16px;
  border-radius: 8px;
  transition: background var(--trans), border-color var(--trans);
  text-decoration: none;
  display: inline-block;
  outline-offset: 3px;
}

.play-now:hover { background: rgba(124,92,252,0.2); border-color: rgba(124,92,252,0.4); }
.play-now:focus-visible { outline: 2px solid var(--accent); }

/* ── Footer ───────────────────────────────────────────────── */
footer { border-top: 1px solid var(--border); }

.footer-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 40px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}

.footer-logo  { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; }
.footer-links { display: flex; gap: 24px; list-style: none; flex-wrap: wrap; }

.footer-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  transition: color var(--trans);
}

.footer-links a:hover { color: var(--text); }
.footer-copy  { font-size: 13px; color: var(--muted); }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar       { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(124,92,252,0.4); border-radius: 3px; }

/* ── Responsive ───────────────────────────────────────────── */
.nav-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  padding: 6px;
  border-radius: 8px;
  cursor: pointer;
}
.nav-hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all 0.3s;
}
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

@media (max-width: 768px) {
  .browse-container { padding: 88px 16px 60px; }
  nav               { padding: 0 20px; }
  .nav-hamburger    { display: flex; }
  .nav-links {
    display: none;
    position: absolute;
    top: 64px; left: 0; right: 0;
    flex-direction: column;
    background: rgba(8,11,20,0.97);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    gap: 4px;
    z-index: 99;
  }
  .nav-links.open   { display: flex; }
  .nav-links a      { padding: 10px 14px; font-size: 15px; }
  .search-bar       { max-width: 100%; }
  .games-grid       { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .footer-inner     { padding: 32px 20px; flex-direction: column; align-items: flex-start; }
}

@media (max-width: 480px) {
  .games-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-dot" aria-hidden="true"></div>
    PlaySphere
  </a>
  <button class="nav-hamburger" id="navHamburger" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="navLinks" role="list">
    <li><a href="index.html">Home</a></li>
    <li><a href="browse.html" class="active" aria-current="page">Browse</a></li>
    <li><a href="trending.html">Trending</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<main>
  <div class="browse-container">

    <header class="browse-header">
      <h1 class="browse-title">Browse All Games</h1>
      <p class="browse-sub">Explore our complete collection of games</p>
    </header>

    <label for="searchInput" class="visually-hidden">Search games</label>
    <input
      type="search"
      id="searchInput"
      class="search-bar"
      placeholder="🔍 Search games..."
      aria-label="Search games"
      autocomplete="off"
      oninput="searchGames()"
    >

    <div class="filter-row" role="group" aria-label="Filter by category">
      <button class="filter-btn active" data-cat="all"      data-label="All Games" onclick="filterGames(this,'all')">All Games</button>
      <button class="filter-btn"        data-cat="arcade"   data-label="Arcade"    onclick="filterGames(this,'arcade')">Arcade</button>
      <button class="filter-btn"        data-cat="puzzle"   data-label="Puzzle"    onclick="filterGames(this,'puzzle')">Puzzle</button>
      <button class="filter-btn"        data-cat="action"   data-label="Action"    onclick="filterGames(this,'action')">Action</button>
      <button class="filter-btn"        data-cat="strategy" data-label="Strategy"  onclick="filterGames(this,'strategy')">Strategy</button>
      <button class="filter-btn"        data-cat="skill"    data-label="Skill"     onclick="filterGames(this,'skill')">Skill</button>
      <button class="filter-btn"        data-cat="board"    data-label="Board"     onclick="filterGames(this,'board')">Board</button>
    </div>

    <div class="games-grid" id="gamesGrid" role="list"></div>

  </div>
</main>

<footer role="contentinfo">
  <div class="footer-inner">
    <div class="footer-logo">PlaySphere</div>
    <ul class="footer-links" role="list">
      <li><a href="index.html">Home</a></li>
      <li><a href="browse.html">Browse</a></li>
      <li><a href="trending.html">Trending</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="#">Privacy</a></li>
    </ul>
    <div class="footer-copy">&copy; 2025 PlaySphere. All rights reserved.</div>
  </div>
</footer>

<script src="games.js"></script>
<script src="app.js"></script>
<!-- script.js injects cursor on all pages -->
<script src="script.js"></script>
<script>
let currentCategory = 'all';

function filterGames(btn, category) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCategory = category;
  applyFilters();
}

function searchGames() { applyFilters(); }

function applyFilters() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

  // Cards are wrapped in <a> tags by buildGameCard(), so target those wrappers
  const wrappers = document.querySelectorAll('#gamesGrid > a');

  wrappers.forEach(wrapper => {
    const card = wrapper.querySelector('.game-card');
    if (!card) return;
    const title       = (card.querySelector('.card-title')?.textContent || '').toLowerCase();
    const desc        = (card.querySelector('.card-desc')?.textContent  || '').toLowerCase();
    const category    = (card.dataset.category || '').toLowerCase();
    const matchSearch = !searchTerm || title.includes(searchTerm) || desc.includes(searchTerm);
    const matchCat    = currentCategory === 'all' || category === currentCategory;
    wrapper.style.display = (matchSearch && matchCat) ? '' : 'none';
  });

  // No-results message
  let noResults = document.getElementById('noResults');
  const anyVisible = [...wrappers].some(w => w.style.display !== 'none');
  if (!anyVisible) {
    if (!noResults) {
      noResults = document.createElement('p');
      noResults.id = 'noResults';
      noResults.style.cssText = 'color:var(--muted);font-size:15px;padding:32px 0;grid-column:1/-1;';
      noResults.textContent = 'No games match your search. Try a different term or category.';
      document.getElementById('gamesGrid').appendChild(noResults);
    }
  } else if (noResults) {
    noResults.remove();
  }
}

// Re-run filters after games.js renders the cards
document.addEventListener('DOMContentLoaded', () => applyFilters());

// Hamburger
const _hb = document.getElementById('navHamburger');
const _nl = document.getElementById('navLinks');
if (_hb && _nl) {
  _hb.addEventListener('click', () => { _hb.classList.toggle('open'); _nl.classList.toggle('open'); });
  _nl.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { _hb.classList.remove('open'); _nl.classList.remove('open'); }));
}
</script>

</body>
</html>
