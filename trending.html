<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Discover trending games on PlaySphere. See what's hot and join thousands of players online.">
<title>Trending — PlaySphere</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%237C5CFC'/%3E%3Cpath d='M35 40h10v30h-10z M55 30h10v40h-10z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #080B14;
  --surface: #0E1422;
  --card:    #111827;
  --border:  rgba(255,255,255,0.07);
  --accent:  #7C5CFC;
  --accent2: #FF6B6B;
  --accent3: #00D4AA;
  --text:    #F0F4FF;
  --muted:   #7B8DB0;
  --gold:    #FFB547;
  --radius:  14px;
  --trans:   0.2s ease;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
}

nav {
  position: fixed;
  inset-block-start: 0;
  inset-inline: 0;
  z-index: 100;
  height: 64px;
  padding: 0 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(8,11,20,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.nav-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-decoration: none;
  user-select: none;
}

.logo-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--accent);
  animation: pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%,100% { box-shadow: 0 0 12px var(--accent); transform: scale(1); }
  50%      { box-shadow: 0 0 24px var(--accent), 0 0 40px rgba(124,92,252,0.4); transform: scale(1.3); }
}

.nav-links { display: flex; gap: 4px; list-style: none; }

.nav-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 7px 16px;
  border-radius: 8px;
  transition: color var(--trans), background var(--trans);
  letter-spacing: 0.01em;
  outline-offset: 3px;
}

.nav-links a:hover  { color: var(--text); background: rgba(124,92,252,0.12); }
.nav-links a.active { color: var(--accent); background: rgba(124,92,252,0.12); }
.nav-links a:focus-visible { outline: 2px solid var(--accent); }

.trending-container {
  padding: 104px 40px 80px;
  max-width: 1280px;
  margin: 0 auto;
}

.trending-header { margin-bottom: 56px; }

.trending-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 5vw, 48px);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 12px;
}

.trending-sub { color: var(--muted); font-size: 16px; }

.trending-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: start;
  margin-bottom: 60px;
}

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 20px;
}

.trending-list { display: flex; flex-direction: column; gap: 10px; }

a.trend-link {
  display: block;
  text-decoration: none;
  color: inherit;
  border-radius: var(--radius);
  outline-offset: 3px;
}

a.trend-link:focus-visible .trending-item { border-color: var(--accent); }
a.trend-link:hover .trending-item {
  border-color: rgba(124,92,252,0.3);
  background: rgba(124,92,252,0.06);
  transform: translateX(4px);
}

.trending-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color var(--trans), background var(--trans), transform var(--trans);
}

.trend-rank {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: var(--muted);
  width: 26px;
  flex-shrink: 0;
  text-align: right;
  line-height: 1;
}

.trend-rank.top { color: var(--gold); }

.trend-thumb {
  width: 48px; height: 38px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
}

.trend-thumb-inner {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.trend-info { flex: 1; min-width: 0; }

.trend-name {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.trend-players { font-size: 11px; color: var(--muted); }

.trend-change {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent3);
  background: rgba(0,212,170,0.1);
  padding: 3px 8px;
  border-radius: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}

.leaderboard-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
}

.leaderboard-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 20px;
}

.leaderboard-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  margin-bottom: 10px;
  transition: background var(--trans);
}

.leaderboard-item:last-child { margin-bottom: 0; }
.leaderboard-item:hover { background: rgba(255,255,255,0.055); }

.leaderboard-rank {
  font-size: 22px;
  font-weight: 800;
  color: var(--gold);
  width: 36px;
  text-align: center;
  flex-shrink: 0;
}

.leaderboard-info { flex: 1; min-width: 0; }
.leaderboard-name  { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; margin-bottom: 3px; }
.leaderboard-score { font-size: 12px; color: var(--muted); }

footer { border-top: 1px solid var(--border); }

.footer-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 40px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}

.footer-logo  { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; }
.footer-links { display: flex; gap: 24px; list-style: none; flex-wrap: wrap; }

.footer-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  transition: color var(--trans);
}

.footer-links a:hover { color: var(--text); }
.footer-copy  { font-size: 13px; color: var(--muted); }

::-webkit-scrollbar       { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(124,92,252,0.4); border-radius: 3px; }

@media (max-width: 900px) {
  .trending-grid { grid-template-columns: 1fr; gap: 40px; }
}

@media (max-width: 600px) {
  nav                 { padding: 0 20px; }
  .trending-container { padding: 96px 20px 60px; }
  .footer-inner       { padding: 32px 20px; flex-direction: column; align-items: flex-start; }
  .nav-links a        { padding: 7px 10px; font-size: 13px; }
}
</style>
</head>

<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-dot" aria-hidden="true"></div>
    PlaySphere
  </a>
  <ul class="nav-links" role="list">
    <li><a href="index.html">Home</a></li>
    <li><a href="browse.html">Browse</a></li>
    <li><a href="trending.html" class="active" aria-current="page">Trending</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<main>
  <div class="trending-container">

    <header class="trending-header">
      <h1 class="trending-title">What's Trending</h1>
      <p class="trending-sub">Most popular games right now</p>
    </header>

    <div class="trending-grid">

      <section aria-labelledby="hot-games-title">
        <h2 class="section-title" id="hot-games-title">🔥 Hot Games</h2>
        <!-- Populated by games.js renderTrendingList() -->
        <div class="trending-list" id="trendingList"></div>
      </section>

      <section aria-labelledby="leaderboard-title">
        <div class="leaderboard-box">
          <h2 class="leaderboard-title" id="leaderboard-title">🏆 Top Players</h2>
          <!-- Populated by games.js renderLeaderboard() -->
          <div id="leaderboardList"></div>
        </div>
      </section>

    </div>

  </div>
</main>

<footer role="contentinfo">
  <div class="footer-inner">
    <div class="footer-logo">PlaySphere</div>
    <ul class="footer-links" role="list">
      <li><a href="index.html">Home</a></li>
      <li><a href="browse.html">Browse</a></li>
      <li><a href="trending.html">Trending</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="#">Privacy</a></li>
    </ul>
    <div class="footer-copy">&copy; 2025 PlaySphere. All rights reserved.</div>
  </div>
</footer>

<script src="games.js"></script>
<script src="app.js"></script>
<script src="script.js"></script>

</body>
</html>
