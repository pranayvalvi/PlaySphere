<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — Neon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030508;
  --surface: #0a0e1a;
  --card-back: #0d1526;
  --border: rgba(255,255,255,0.06);
  --cyan: #00cfff;
  --pink: #ff6b9d;
  --green: #00ff88;
  --gold: #ffd700;
  --purple: #a855f7;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

/* BG grid */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,207,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,207,255,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

#bgCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; }

.game-wrapper {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 20px;
}

/* Title */
.title {
  font-family: 'Orbitron', sans-serif;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 6px;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 14px rgba(0,207,255,0.35));
}

/* Difficulty */
.diff-row {
  display: flex;
  gap: 8px;
}
.diff-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 7px 18px;
  border-radius: 50px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  color: rgba(255,255,255,0.35);
  cursor: pointer;
  transition: all 0.2s;
}
.diff-btn:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.15); }
.diff-btn.active { background: rgba(0,207,255,0.12); border-color: rgba(0,207,255,0.4); color: var(--cyan); }

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 10px;
  align-items: stretch;
}
.stat-pill {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 20px;
  text-align: center;
  min-width: 80px;
}
.stat-pill .lbl {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  margin-bottom: 3px;
}
.stat-pill .val {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  font-weight: 700;
}
#movesVal  { color: var(--cyan); text-shadow: 0 0 14px rgba(0,207,255,0.4); }
#timerVal  { color: var(--pink); text-shadow: 0 0 14px rgba(255,107,157,0.4); }
#comboVal  { color: var(--gold); text-shadow: 0 0 14px rgba(255,215,0,0.4); }
#bestVal   { color: var(--green); text-shadow: 0 0 14px rgba(0,255,136,0.4); }

/* Combo flash */
.combo-flash {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Orbitron', sans-serif;
  font-size: 52px;
  font-weight: 900;
  pointer-events: none;
  z-index: 200;
  opacity: 0;
  text-shadow: 0 0 40px currentColor;
}

/* Grid */
.grid {
  display: grid;
  gap: 10px;
  position: relative;
}

/* Card */
.card {
  width: 80px;
  height: 80px;
  position: relative;
  cursor: pointer;
  perspective: 600px;
}
.card.large { width: 90px; height: 90px; }
.card.small { width: 68px; height: 68px; }

.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
}
.card.flipped .card-inner,
.card.matched .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Back face */
.card-back {
  background: var(--card-back);
  border: 1px solid rgba(0,207,255,0.12);
  transition: border-color 0.2s, box-shadow 0.2s;
  overflow: hidden;
}
.card-back::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 8px,
      rgba(0,207,255,0.03) 8px,
      rgba(0,207,255,0.03) 9px
    );
}
.card-back::after {
  content: '?';
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: rgba(0,207,255,0.15);
}
.card:hover:not(.flipped):not(.matched) .card-back {
  border-color: rgba(0,207,255,0.35);
  box-shadow: 0 0 18px rgba(0,207,255,0.12), inset 0 0 18px rgba(0,207,255,0.04);
}
.card:hover:not(.flipped):not(.matched) .card-back::after {
  color: rgba(0,207,255,0.35);
}
.card:hover:not(.flipped):not(.matched) {
  transform: translateY(-2px) scale(1.04);
}

/* Front face */
.card-front {
  transform: rotateY(180deg);
  font-size: 36px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
}
.card.large .card-front { font-size: 42px; }
.card.small .card-front { font-size: 28px; }

/* Matched glow per color */
.card.matched .card-front {
  animation: matchPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes matchPop {
  0%  { transform: rotateY(180deg) scale(1); }
  50% { transform: rotateY(180deg) scale(1.18); }
  100%{ transform: rotateY(180deg) scale(1); }
}

.card.wrong .card-inner {
  animation: wrongShake 0.4s ease;
}
@keyframes wrongShake {
  0%,100%{ transform: rotateY(180deg) translateX(0); }
  20%    { transform: rotateY(180deg) translateX(-5px); }
  60%    { transform: rotateY(180deg) translateX(5px); }
}

/* Win overlay */
.win-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(3,5,8,0.88);
  backdrop-filter: blur(14px);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
.win-overlay.show { opacity: 1; pointer-events: all; }

.win-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 48px;
  font-weight: 900;
  background: linear-gradient(90deg, var(--gold), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(255,215,0,0.5));
  margin-bottom: 8px;
  animation: winBounce 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes winBounce {
  from { transform: scale(0.5); opacity:0; }
  to   { transform: scale(1); opacity:1; }
}
.win-sub { font-size: 16px; color: rgba(255,255,255,0.4); margin-bottom: 32px; letter-spacing:0.06em; }
.win-stats {
  display: flex;
  gap: 20px;
  margin-bottom: 36px;
}
.win-stat {
  text-align: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 16px 28px;
}
.win-stat .wlbl { font-size: 10px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-bottom:6px; }
.win-stat .wval { font-family:'Orbitron',sans-serif; font-size:26px; font-weight:900; }

.btn-play {
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: #030508;
  background: linear-gradient(135deg, var(--gold), #ff9f43);
  border: none;
  padding: 14px 44px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 0 30px rgba(255,215,0,0.35);
}
.btn-play:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 0 50px rgba(255,215,0,0.55); }

.restart-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: #030508;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  border: none;
  padding: 10px 30px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 0 20px rgba(0,207,255,0.25);
}
.restart-btn:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(0,207,255,0.45); }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="combo-flash" id="comboFlash"></div>

<div class="game-wrapper">
  <div class="title">🃏 MEMORY</div>

  <div class="diff-row">
    <button class="diff-btn active" onclick="setDiff('easy')">EASY 4×4</button>
    <button class="diff-btn" onclick="setDiff('medium')">MEDIUM 5×4</button>
    <button class="diff-btn" onclick="setDiff('hard')">HARD 6×5</button>
  </div>

  <div class="stats-bar">
    <div class="stat-pill"><div class="lbl">Moves</div><div class="val" id="movesVal">0</div></div>
    <div class="stat-pill"><div class="lbl">Time</div><div class="val" id="timerVal">0:00</div></div>
    <div class="stat-pill"><div class="lbl">Combo</div><div class="val" id="comboVal">×1</div></div>
    <div class="stat-pill"><div class="lbl">Best</div><div class="val" id="bestVal">—</div></div>
  </div>

  <div class="grid" id="grid"></div>

  <button class="restart-btn" onclick="startGame()">↺ Shuffle</button>
</div>

<!-- Win screen -->
<div class="win-overlay" id="winOverlay">
  <div class="win-title">YOU WIN!</div>
  <div class="win-sub">All pairs matched — well done!</div>
  <div class="win-stats">
    <div class="win-stat"><div class="wlbl">Moves</div><div class="wval" id="wMoves" style="color:var(--cyan)">0</div></div>
    <div class="win-stat"><div class="wlbl">Time</div><div class="wval" id="wTime" style="color:var(--pink)">0:00</div></div>
    <div class="win-stat"><div class="wlbl">Combo Peak</div><div class="wval" id="wCombo" style="color:var(--gold)">×1</div></div>
  </div>
  <button class="btn-play" onclick="startGame()">PLAY AGAIN</button>
</div>

<script>
// ── BG PARTICLES ──────────────────────────────────────────────────
const bgC = document.getElementById('bgCanvas');
const bgX = bgC.getContext('2d');
bgC.width = window.innerWidth; bgC.height = window.innerHeight;
const bgPts = Array.from({length:50}, () => ({
  x: Math.random()*bgC.width, y: Math.random()*bgC.height,
  vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25,
  r: Math.random()*1.2+.3, a: Math.random()*Math.PI*2,
  c:['rgba(0,207,255,','rgba(168,85,247,','rgba(255,107,157,'][Math.floor(Math.random()*3)]
}));
(function bgLoop(){
  bgX.fillStyle='rgba(3,5,8,.18)';
  bgX.fillRect(0,0,bgC.width,bgC.height);
  bgPts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.a+=.012;
    if(p.x<0||p.x>bgC.width)  p.vx*=-1;
    if(p.y<0||p.y>bgC.height) p.vy*=-1;
    bgX.beginPath(); bgX.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgX.fillStyle=p.c+(0.08+Math.sin(p.a)*.07)+')'; bgX.fill();
  });
  requestAnimationFrame(bgLoop);
})();

// ── EMOJI SETS ────────────────────────────────────────────────────
const ALL_EMOJIS = [
  '🔥','⚡','🌊','🌙','⭐','💎','🎯','🚀',
  '🦊','🐉','🌸','🍀','🎸','🎮','🏆','👾',
  '🦋','🌈','🍕','🎲','🔮','🎪','🦄','🌺'
];

const DIFFS = {
  easy:   { cols: 4, rows: 4, pairs: 8,  size: 'large' },
  medium: { cols: 5, rows: 4, pairs: 10, size: '' },
  hard:   { cols: 6, rows: 5, pairs: 15, size: 'small' }
};

// Card color themes based on emoji
const CARD_COLORS = [
  '#ff6b9d','#00cfff','#00ff88','#ffd700','#a855f7',
  '#ff9f43','#00d2d3','#ff4757','#2ed573','#1e90ff',
  '#fd79a8','#fdcb6e','#6c5ce7','#00b894','#e17055'
];

// ── GAME STATE ────────────────────────────────────────────────────
let diff = 'easy';
let cards = [];
let flipped = [];
let matched = [];
let moves = 0;
let combo = 0;
let maxCombo = 1;
let locked = false;
let timerSec = 0;
let timerInterval = null;
let gameStarted = false;

function setDiff(d) {
  diff = d;
  document.querySelectorAll('.diff-btn').forEach((b,i) => {
    b.classList.toggle('active', ['easy','medium','hard'][i] === d);
  });
  startGame();
}

// ── BUILD GAME ────────────────────────────────────────────────────
function startGame() {
  clearInterval(timerInterval);
  timerSec = 0;
  moves = 0;
  combo = 0;
  maxCombo = 1;
  flipped = [];
  matched = [];
  locked = false;
  gameStarted = false;
  document.getElementById('winOverlay').classList.remove('show');
  updateStats();

  const cfg = DIFFS[diff];
  const emojis = shuffle([...ALL_EMOJIS]).slice(0, cfg.pairs);
  const pairs  = shuffle([...emojis, ...emojis]);

  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
  grid.innerHTML = '';
  cards = [];

  pairs.forEach((emoji, i) => {
    const color = CARD_COLORS[emojis.indexOf(emoji) % CARD_COLORS.length];
    const card = createCard(emoji, i, color, cfg.size);
    grid.appendChild(card);
    cards.push({ el: card, emoji, color, id: i });
  });

  // Staggered entrance
  cards.forEach((c, i) => {
    c.el.style.opacity = '0';
    c.el.style.transform = 'scale(0.6)';
    setTimeout(() => {
      c.el.style.transition = 'opacity 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';
      c.el.style.opacity = '1';
      c.el.style.transform = '';
    }, i * 40);
  });
}

function createCard(emoji, id, color, sizeClass) {
  const card = document.createElement('div');
  card.className = `card${sizeClass ? ' '+sizeClass : ''}`;
  card.innerHTML = `
    <div class="card-inner">
      <div class="card-back"></div>
      <div class="card-front" style="background:${color}18;border-color:${color}30;box-shadow:inset 0 0 20px ${color}10;">
        <span style="filter:drop-shadow(0 0 8px ${color})">${emoji}</span>
      </div>
    </div>`;
  card.addEventListener('click', () => handleFlip(id));
  return card;
}

function shuffle(arr) {
  for(let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ── FLIP LOGIC ────────────────────────────────────────────────────
function handleFlip(id) {
  if(locked) return;
  const card = cards[id];
  if(card.el.classList.contains('flipped') || card.el.classList.contains('matched')) return;

  // Start timer on first flip
  if(!gameStarted) {
    gameStarted = true;
    timerInterval = setInterval(() => { timerSec++; updateStats(); }, 1000);
  }

  card.el.classList.add('flipped');
  flipped.push(id);

  if(flipped.length === 2) {
    moves++;
    locked = true;
    updateStats();
    const [a, b] = flipped;

    if(cards[a].emoji === cards[b].emoji) {
      // MATCH
      combo++;
      if(combo > maxCombo) maxCombo = combo;
      matched.push(a, b);

      setTimeout(() => {
        cards[a].el.classList.add('matched');
        cards[b].el.classList.add('matched');

        // Glow the matched cards
        const col = cards[a].color;
        [cards[a].el, cards[b].el].forEach(el => {
          el.querySelector('.card-front').style.boxShadow =
            `inset 0 0 20px ${col}20, 0 0 20px ${col}50, 0 0 40px ${col}25`;
          el.querySelector('.card-front').style.borderColor = col+'80';
        });

        flipped = [];
        locked = false;
        updateStats();
        showComboFlash(combo, col);

        if(matched.length === cards.length) {
          setTimeout(showWin, 500);
        }
      }, 300);
    } else {
      // MISMATCH
      combo = 0;
      updateStats();
      [cards[a].el, cards[b].el].forEach(el => el.classList.add('wrong'));

      setTimeout(() => {
        cards[a].el.classList.remove('flipped', 'wrong');
        cards[b].el.classList.remove('flipped', 'wrong');
        flipped = [];
        locked = false;
      }, 900);
    }
  }
}

// ── COMBO FLASH ───────────────────────────────────────────────────
function showComboFlash(n, color) {
  if(n < 2) return;
  const el = document.getElementById('comboFlash');
  const msgs = {2:'NICE!',3:'GREAT!',4:'AWESOME!',5:'ON FIRE!',6:'UNSTOPPABLE!'};
  el.textContent = msgs[Math.min(n,6)] || '🔥 LEGENDARY!';
  el.style.color = color;
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%,-50%) scale(1.2)';
  el.style.transition = 'none';
  setTimeout(() => {
    el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%,-60%) scale(0.8)';
  }, 700);
}

// ── STATS ─────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('movesVal').textContent = moves;
  const m = Math.floor(timerSec/60), s = timerSec%60;
  document.getElementById('timerVal').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('comboVal').textContent = `×${combo+1}`;

  const best = localStorage.getItem(`memBest_${diff}`);
  document.getElementById('bestVal').textContent = best ? best+'m' : '—';
}

// ── WIN ───────────────────────────────────────────────────────────
function showWin() {
  clearInterval(timerInterval);
  const m = Math.floor(timerSec/60), s = timerSec%60;
  const timeStr = `${m}:${s.toString().padStart(2,'0')}`;

  document.getElementById('wMoves').textContent = moves;
  document.getElementById('wTime').textContent = timeStr;
  document.getElementById('wCombo').textContent = `×${maxCombo}`;

  // Save best (by moves)
  const best = parseInt(localStorage.getItem(`memBest_${diff}`) || '9999');
  if(moves < best) {
    localStorage.setItem(`memBest_${diff}`, moves);
    document.getElementById('bestVal').textContent = moves+'m';
  }

  document.getElementById('winOverlay').classList.add('show');
}

// ── INIT ──────────────────────────────────────────────────────────
startGame();
</script>
</body>
</html>
