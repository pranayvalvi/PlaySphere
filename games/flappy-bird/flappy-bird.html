<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird — Neon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#030508;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Rajdhani',sans-serif;color:#fff;overflow:hidden;user-select:none;}
.title{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;letter-spacing:5px;background:linear-gradient(90deg,#ffd700,#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;}
.hud{display:flex;gap:24px;margin-bottom:8px;}
.hud-pill{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:8px 20px;text-align:center;}
.hud-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.3);}
.hud-val{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;}
.canvas-wrap{position:relative;}
canvas{border-radius:14px;box-shadow:0 0 40px rgba(0,0,0,0.8),0 0 0 1px rgba(255,215,0,0.1);display:block;}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,5,8,0.88);backdrop-filter:blur(12px);border-radius:14px;z-index:10;}
.ov-title{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;margin-bottom:8px;}
.ov-sub{font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:28px;text-align:center;line-height:1.7;}
.ov-score{font-family:'Orbitron',sans-serif;font-size:52px;font-weight:900;color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,0.6);margin-bottom:4px;}
.ov-best{font-size:13px;color:#00cfff;margin-bottom:28px;}
.btn{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.15em;color:#030508;background:linear-gradient(135deg,#ffd700,#ff9f43);border:none;padding:12px 40px;border-radius:50px;cursor:pointer;transition:all 0.25s;box-shadow:0 0 25px rgba(255,215,0,0.3);}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(255,215,0,0.5);}
</style>
</head>
<body>
<div class="title">🐦 FLAPPY BIRD</div>
<div class="hud">
  <div class="hud-pill"><div class="hud-label">Score</div><div class="hud-val" id="sc" style="color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,0.5)">0</div></div>
  <div class="hud-pill"><div class="hud-label">Best</div><div class="hud-val" id="be" style="color:#00cfff;text-shadow:0 0 12px rgba(0,207,255,0.5)">0</div></div>
</div>
<div class="canvas-wrap">
  <canvas id="c" width="360" height="520"></canvas>
  <div class="overlay" id="startOv">
    <div class="ov-title" style="background:linear-gradient(90deg,#ffd700,#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">FLAPPY BIRD</div>
    <div class="ov-sub">Tap, click or press SPACE<br>to flap through the pipes!</div>
    <button class="btn" onclick="startGame()">FLY</button>
  </div>
  <div class="overlay" id="overOv" style="display:none;">
    <div class="ov-title" style="color:#ff4466;text-shadow:0 0 30px rgba(255,68,102,0.5);">CRASHED!</div>
    <div class="ov-score" id="overSc">0</div>
    <div class="ov-best" id="overBest">Best: 0</div>
    <button class="btn" onclick="startGame()">FLY AGAIN</button>
  </div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
let bird,pipes,particles,score,best,running,animId,frameCount;
best=parseInt(localStorage.getItem('flappyBest')||'0');
document.getElementById('be').textContent=best;

const GAP=130,PIPE_W=52,PIPE_SPEED=2.4,GRAVITY=0.38,FLAP=-7.2;

function startGame(){
  document.getElementById('startOv').style.display='none';
  document.getElementById('overOv').style.display='none';
  bird={x:80,y:H/2,vy:0,r:14,angle:0,flap:false};
  pipes=[];particles=[];score=0;frameCount=0;running=true;
  document.getElementById('sc').textContent=0;
  if(animId)cancelAnimationFrame(animId);
  loop();
}

function flap(){
  if(!running)return;
  bird.vy=FLAP;bird.flap=true;
  setTimeout(()=>bird.flap=false,120);
  spawnParticles(bird.x-10,bird.y+8,'#ffd700',6);
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
c.addEventListener('click',flap);
c.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});

function spawnParticles(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*3+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.04+Math.random()*0.03,color,size:Math.random()*3+1});
  }
}

function loop(){
  if(!running)return;
  update();draw();animId=requestAnimationFrame(loop);
}

function update(){
  frameCount++;
  bird.vy+=GRAVITY;
  bird.y+=bird.vy;
  bird.angle=Math.min(Math.PI/4,Math.max(-Math.PI/4,bird.vy*0.06));

  if(frameCount%85===0){
    const top=60+Math.random()*(H-GAP-120);
    pipes.push({x:W,topH:top,scored:false});
  }

  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i];
    p.x-=PIPE_SPEED;
    if(!p.scored&&p.x+PIPE_W<bird.x){
      p.scored=true;score++;
      document.getElementById('sc').textContent=score;
      spawnParticles(bird.x,bird.y,'#00ff88',10);
    }
    if(bird.x+bird.r-8>p.x&&bird.x-bird.r+8<p.x+PIPE_W){
      if(bird.y-bird.r<p.topH||bird.y+bird.r>p.topH+GAP){endGame();return;}
    }
    if(p.x+PIPE_W<0)pipes.splice(i,1);
  }

  if(bird.y-bird.r<0){bird.y=bird.r;bird.vy=0;}
  if(bird.y+bird.r>H){endGame();return;}

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.vx*=0.95;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#03050f');sky.addColorStop(1,'#060b18');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,0.35)';
  for(let i=0;i<40;i++){const sx=(i*113.5)%W,sy=(i*79.3)%H;ctx.fillRect(sx,sy,1,1);}

  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life;ctx.shadowBlur=8;ctx.shadowColor=p.color;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore();
  });

  pipes.forEach(p=>{
    ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#00ff88';
    drawPipe(p.x,0,PIPE_W,p.topH,true);
    drawPipe(p.x,p.topH+GAP,PIPE_W,H-(p.topH+GAP),false);
    ctx.restore();
  });

  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.angle);
  ctx.shadowBlur=20;ctx.shadowColor='#ffd700';
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.ellipse(0,0,bird.r,bird.r-3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff9f43';ctx.beginPath();
  if(bird.flap)ctx.ellipse(-4,4,8,5,Math.PI/4,0,Math.PI*2);
  else ctx.ellipse(-4,0,8,4,-Math.PI/6,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#030508';ctx.beginPath();ctx.arc(6,-3,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-4,1.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff6b00';ctx.beginPath();ctx.moveTo(12,-2);ctx.lineTo(18,0);ctx.lineTo(12,3);ctx.closePath();ctx.fill();
  ctx.restore();

  ctx.save();ctx.font='bold 28px Orbitron';ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillText(score,W/2+1,52);
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText(score,W/2,51);ctx.restore();
}

function drawPipe(x,y,w,h,isTop){
  const capH=18,capExtra=6;
  const g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'#004d22');g.addColorStop(0.4,'#00a84f');g.addColorStop(0.7,'#00ff88');g.addColorStop(1,'#004d22');
  ctx.fillStyle=g;
  ctx.fillRect(x,y,w,h);
  const cy=isTop?y+h-capH:y;
  const capG=ctx.createLinearGradient(x-capExtra,0,x+w+capExtra,0);
  capG.addColorStop(0,'#003d1a');capG.addColorStop(0.4,'#008040');capG.addColorStop(0.7,'#00cc66');capG.addColorStop(1,'#003d1a');
  ctx.fillStyle=capG;
  ctx.fillRect(x-capExtra,cy,w+capExtra*2,capH);
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(x+4,y,6,h);
}

function endGame(){
  running=false;
  spawnParticles(bird.x,bird.y,'#ff4466',30);
  if(score>best){best=score;localStorage.setItem('flappyBest',best);}
  document.getElementById('be').textContent=best;
  document.getElementById('overSc').textContent=score;
  document.getElementById('overBest').textContent=score>=best?'🏆 New Best!':'Best: '+best;
  setTimeout(()=>document.getElementById('overOv').style.display='flex',700);
}
</script>
</body>
</html>
