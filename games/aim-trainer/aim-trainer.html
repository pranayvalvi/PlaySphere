<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aim Trainer — Neon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#030508;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Rajdhani',sans-serif;color:#fff;overflow:hidden;user-select:none;cursor:crosshair;}
.title{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#ff4466,#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;}
.hud{display:flex;gap:20px;margin-bottom:10px;}
.hud-pill{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:8px 20px;text-align:center;min-width:90px;}
.hud-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.3);}
.hud-val{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;}
.canvas-wrap{position:relative;}
canvas{border-radius:14px;box-shadow:0 0 40px rgba(0,0,0,0.8),0 0 0 1px rgba(255,68,102,0.1);display:block;cursor:crosshair;}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,5,8,0.88);backdrop-filter:blur(12px);border-radius:14px;z-index:10;}
.ov-title{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;margin-bottom:8px;}
.ov-sub{font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:24px;text-align:center;line-height:1.6;}
.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px;}
.result-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 20px;text-align:center;}
.r-val{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;}
.r-lbl{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-top:2px;}
.btn{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.15em;color:#030508;background:linear-gradient(135deg,#ff4466,#ff9f43);border:none;padding:12px 40px;border-radius:50px;cursor:pointer;transition:all 0.25s;box-shadow:0 0 25px rgba(255,68,102,0.3);}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(255,68,102,0.5);}
.mode-row{display:flex;gap:8px;margin-bottom:10px;}
.mode-btn{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;padding:6px 16px;border-radius:50px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.35);cursor:pointer;transition:all 0.2s;}
.mode-btn.active{background:rgba(255,68,102,0.15);border-color:rgba(255,68,102,0.4);color:#ff6b9d;}
</style>
</head>
<body>
<div class="title">🎯 AIM TRAINER</div>
<div class="mode-row">
  <button class="mode-btn active" onclick="setMode('classic')">Classic</button>
  <button class="mode-btn" onclick="setMode('shrink')">Shrinking</button>
  <button class="mode-btn" onclick="setMode('moving')">Moving</button>
</div>
<div class="hud">
  <div class="hud-pill"><div class="hud-label">Score</div><div class="hud-val" id="sc" style="color:#ff4466;text-shadow:0 0 12px rgba(255,68,102,0.5)">0</div></div>
  <div class="hud-pill"><div class="hud-label">Hits</div><div class="hud-val" id="hi" style="color:#00ff88;text-shadow:0 0 12px rgba(0,255,136,0.5)">0</div></div>
  <div class="hud-pill"><div class="hud-label">Miss</div><div class="hud-val" id="mi" style="color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,0.5)">0</div></div>
  <div class="hud-pill"><div class="hud-label">Time</div><div class="hud-val" id="ti" style="color:#a855f7;text-shadow:0 0 12px rgba(168,85,247,0.5)">30</div></div>
  <div class="hud-pill"><div class="hud-label">Avg ms</div><div class="hud-val" id="rt" style="color:#00cfff;text-shadow:0 0 12px rgba(0,207,255,0.5)">—</div></div>
</div>
<div class="canvas-wrap">
  <canvas id="c" width="640" height="420"></canvas>
  <div class="overlay" id="startOv">
    <div class="ov-title" style="background:linear-gradient(90deg,#ff4466,#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">AIM TRAINER</div>
    <div class="ov-sub">Click targets as fast as you can!<br>30 second challenge · Track your reaction time</div>
    <button class="btn" onclick="startGame()">START</button>
  </div>
  <div class="overlay" id="resultOv" style="display:none;">
    <div class="ov-title" style="color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,0.5);">TIME'S UP!</div>
    <div class="result-grid">
      <div class="result-box"><div class="r-val" id="rScore" style="color:#ff4466">0</div><div class="r-lbl">Score</div></div>
      <div class="result-box"><div class="r-val" id="rAcc" style="color:#00ff88">0%</div><div class="r-lbl">Accuracy</div></div>
      <div class="result-box"><div class="r-val" id="rAvg" style="color:#00cfff">—</div><div class="r-lbl">Avg React</div></div>
      <div class="result-box"><div class="r-val" id="rHits" style="color:#00ff88">0</div><div class="r-lbl">Hits</div></div>
      <div class="result-box"><div class="r-val" id="rMiss" style="color:#ffd700">0</div><div class="r-lbl">Misses</div></div>
      <div class="result-box"><div class="r-val" id="rBest" style="color:#a855f7">0</div><div class="r-lbl">Best Score</div></div>
    </div>
    <button class="btn" onclick="startGame()">PLAY AGAIN</button>
  </div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
let targets,particles,score,hits,misses,timeLeft,mode,running,animId,timerInterval,reactionTimes,spawnTime;
let best=parseInt(localStorage.getItem('aimBest')||'0');
mode='classic';

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().includes(m)));
}

function startGame(){
  document.getElementById('startOv').style.display='none';
  document.getElementById('resultOv').style.display='none';
  score=0;hits=0;misses=0;timeLeft=30;running=true;
  targets=[];particles=[];reactionTimes=[];
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;document.getElementById('ti').textContent=timeLeft;
    if(timeLeft<=0){clearInterval(timerInterval);endGame();}
  },1000);
  spawnTarget();
  if(animId)cancelAnimationFrame(animId);
  loop();
}

function spawnTarget(){
  if(!running)return;
  const r=mode==='shrink'?50:mode==='moving'?28:32+Math.random()*20;
  const t={
    x:r+Math.random()*(W-r*2), y:r+Math.random()*(H-r*2),
    r, maxR:r, life:1, born:Date.now(),
    vx:mode==='moving'?(Math.random()-0.5)*3.5:0,
    vy:mode==='moving'?(Math.random()-0.5)*3.5:0,
    color:['#ff4466','#ff9f43','#a855f7','#00cfff','#00ff88'][Math.floor(Math.random()*5)],
    shrinkRate:mode==='shrink'?0.012:0,
  };
  targets.push(t);
  spawnTime=Date.now();
}

function spawnParticles(x,y,color){
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*6+2;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.04+Math.random()*0.03,color,size:Math.random()*4+1.5});
  }
}

c.addEventListener('click',e=>{
  if(!running)return;
  const r=c.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  let hit=false;
  for(let i=targets.length-1;i>=0;i--){
    const t=targets[i];
    if(Math.hypot(mx-t.x,my-t.y)<t.r){
      const rt=Date.now()-spawnTime;
      reactionTimes.push(rt);
      const pts=Math.max(10,Math.round(200-rt/10));
      score+=pts;hits++;
      spawnParticles(t.x,t.y,t.color);
      targets.splice(i,1);
      hit=true;
      particles.push({x:mx,y:my-20,vx:0,vy:-1.5,life:1,decay:0.025,color:'#fff',size:0,text:'+'+pts});
      spawnTarget();
      updateHUD();break;
    }
  }
  if(!hit){misses++;score=Math.max(0,score-5);spawnParticles(mx,my,'rgba(255,255,255,0.3)');updateHUD();}
});

function loop(){
  if(!running)return;
  update();draw();animId=requestAnimationFrame(loop);
}

function update(){
  targets.forEach(t=>{
    if(mode==='moving'){
      t.x+=t.vx;t.y+=t.vy;
      if(t.x-t.r<0||t.x+t.r>W)t.vx*=-1;
      if(t.y-t.r<0||t.y+t.r>H)t.vy*=-1;
    }
    if(t.shrinkRate){t.r-=t.shrinkRate;if(t.r<4){targets.splice(targets.indexOf(t),1);misses++;spawnTarget();updateHUD();}}
    t.life=mode==='shrink'?t.r/t.maxR:Math.max(0.2,1-(Date.now()-t.born)/4000);
  });
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.93;p.vy*=0.93;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  ctx.fillStyle='rgba(3,5,8,0.3)';ctx.fillRect(0,0,W,H);

  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life;
    if(p.text){
      ctx.font=`bold 16px Orbitron`;ctx.fillStyle='#fff';ctx.textAlign='center';
      ctx.shadowBlur=10;ctx.shadowColor='#fff';ctx.fillText(p.text,p.x,p.y);
    } else {
      ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });

  targets.forEach(t=>{
    ctx.save();
    ctx.globalAlpha=t.life;
    ctx.shadowBlur=20;ctx.shadowColor=t.color;
    ctx.strokeStyle=t.color;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.stroke();
    ctx.lineWidth=1;
    [0.65,0.35].forEach(f=>{ctx.beginPath();ctx.arc(t.x,t.y,t.r*f,0,Math.PI*2);ctx.stroke();});
    ctx.shadowBlur=14;ctx.fillStyle=t.color;
    ctx.beginPath();ctx.arc(t.x,t.y,t.r*0.12,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,t.r);
    g.addColorStop(0,t.color.replace('1)','0.08)'));g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();
    if(mode!=='shrink'){
      const elapsed=(Date.now()-t.born)/4000;
      ctx.strokeStyle=t.color;ctx.lineWidth=3;ctx.lineCap='round';
      ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(t.x,t.y,t.r+5,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-elapsed));ctx.stroke();
    }
    ctx.restore();
  });
}

function updateHUD(){
  document.getElementById('sc').textContent=score;
  document.getElementById('hi').textContent=hits;
  document.getElementById('mi').textContent=misses;
  const avg=reactionTimes.length?Math.round(reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length):null;
  document.getElementById('rt').textContent=avg?avg+'ms':'—';
}

function endGame(){
  running=false;
  cancelAnimationFrame(animId);
  const total=hits+misses;
  const acc=total?Math.round(hits/total*100):0;
  const avg=reactionTimes.length?Math.round(reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length):0;
  if(score>best){best=score;localStorage.setItem('aimBest',best);}
  document.getElementById('rScore').textContent=score;
  document.getElementById('rAcc').textContent=acc+'%';
  document.getElementById('rAvg').textContent=avg?avg+'ms':'—';
  document.getElementById('rHits').textContent=hits;
  document.getElementById('rMiss').textContent=misses;
  document.getElementById('rBest').textContent=best;
  document.getElementById('resultOv').style.display='flex';
}
</script>
</body>
</html>
