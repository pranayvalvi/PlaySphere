<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Neon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#030508;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Rajdhani',sans-serif;color:#fff;overflow:hidden;user-select:none;}
.title{font-family:'Orbitron',sans-serif;font-size:40px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#ffd700,#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;}
.hud{display:flex;gap:20px;margin-bottom:14px;}
.score-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,215,0,0.15);border-radius:14px;padding:10px 24px;text-align:center;}
.score-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,215,0,0.5);}
.score-val{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:#ffd700;text-shadow:0 0 14px rgba(255,215,0,0.5);}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,215,0,0.1);border-radius:18px;}
.cell{width:100px;height:100px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:28px;transition:transform 0.08s ease;position:relative;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);}
.cell.new{animation:pop 0.2s cubic-bezier(0.34,1.56,0.64,1) both;}
.cell.merge{animation:merge 0.18s cubic-bezier(0.34,1.56,0.64,1) both;}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
@keyframes merge{0%{transform:scale(1);}50%{transform:scale(1.2);}100%{transform:scale(1);}}
.controls-hint{margin-top:12px;font-size:12px;color:rgba(255,255,255,0.2);letter-spacing:0.06em;}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,5,8,0.9);backdrop-filter:blur(14px);z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.overlay.show{opacity:1;pointer-events:all;}
.ov-title{font-family:'Orbitron',sans-serif;font-size:44px;font-weight:900;margin-bottom:8px;}
.ov-score{font-family:'Orbitron',sans-serif;font-size:52px;font-weight:900;color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,0.6);margin-bottom:8px;}
.ov-sub{font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:32px;}
.btn{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.15em;color:#030508;background:linear-gradient(135deg,#ffd700,#ff9f43);border:none;padding:12px 40px;border-radius:50px;cursor:pointer;transition:all 0.25s;box-shadow:0 0 25px rgba(255,215,0,0.3);}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(255,215,0,0.55);}
.restart-btn{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.15em;color:#030508;background:linear-gradient(135deg,#00cfff,#a855f7);border:none;padding:8px 24px;border-radius:50px;cursor:pointer;transition:all 0.2s;box-shadow:0 0 16px rgba(0,207,255,0.2);margin-top:8px;}
.restart-btn:hover{transform:translateY(-1px);}
</style>
</head>
<body>
<div class="title">2048</div>
<div class="hud">
  <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="sc">0</div></div>
  <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="be" style="color:#00cfff;text-shadow:0 0 14px rgba(0,207,255,0.5);">0</div></div>
</div>
<div class="board" id="board"></div>
<button class="restart-btn" onclick="init()" style="margin-top:12px;">↺ New Game</button>
<div class="controls-hint">Arrow Keys or Swipe to merge tiles</div>

<div class="overlay" id="winOv">
  <div class="ov-title" style="background:linear-gradient(90deg,#ffd700,#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">YOU WIN!</div>
  <div class="ov-score" id="winSc">0</div>
  <div class="ov-sub">You reached 2048! Keep going?</div>
  <div style="display:flex;gap:12px;">
    <button class="btn" onclick="keepGoing()">KEEP GOING</button>
    <button class="btn" style="background:linear-gradient(135deg,#a855f7,#ff6b9d);" onclick="init()">NEW GAME</button>
  </div>
</div>
<div class="overlay" id="overOv">
  <div class="ov-title" style="color:#ff4466;text-shadow:0 0 30px rgba(255,68,102,0.6);">GAME OVER</div>
  <div class="ov-score" id="overSc">0</div>
  <div class="ov-sub" id="overSub">No more moves!</div>
  <button class="btn" onclick="init()">TRY AGAIN</button>
</div>

<script>
const TILE_COLORS = {
  2:    ['#ffd700','rgba(255,215,0,0.12)','18px'],
  4:    ['#ff9f43','rgba(255,159,67,0.12)','18px'],
  8:    ['#ff6b9d','rgba(255,107,157,0.15)','18px'],
  16:   ['#ff4466','rgba(255,68,102,0.15)','16px'],
  32:   ['#a855f7','rgba(168,85,247,0.15)','16px'],
  64:   ['#00cfff','rgba(0,207,255,0.15)','16px'],
  128:  ['#00ff88','rgba(0,255,136,0.15)','14px'],
  256:  ['#ffd700','rgba(255,215,0,0.2)','14px'],
  512:  ['#ff6b9d','rgba(255,107,157,0.2)','12px'],
  1024: ['#a855f7','rgba(168,85,247,0.2)','11px'],
  2048: ['#ffffff','rgba(255,255,255,0.25)','10px'],
};

let grid, score, best, won, running;
best = parseInt(localStorage.getItem('2048best')||'0');
document.getElementById('be').textContent = best;

function init() {
  grid = Array(4).fill(null).map(()=>Array(4).fill(0));
  score = 0; won = false; running = true;
  document.getElementById('winOv').classList.remove('show');
  document.getElementById('overOv').classList.remove('show');
  addTile(); addTile();
  render();
}

function keepGoing() {
  won = true;
  document.getElementById('winOv').classList.remove('show');
  running = true;
}

function addTile() {
  const empty = [];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(grid[r][c]===0) empty.push([r,c]);
  if(!empty.length) return false;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  grid[r][c] = Math.random()<0.9?2:4;
  return [r,c];
}

function slide(row) {
  let arr = row.filter(v=>v);
  let merged = false, gained = 0;
  for(let i=0;i<arr.length-1;i++) {
    if(arr[i]===arr[i+1]&&!merged) {
      arr[i]*=2; gained+=arr[i]; arr.splice(i+1,1); merged=true;
    } else merged=false;
  }
  while(arr.length<4) arr.push(0);
  return {arr,gained};
}

function move(dir) {
  if(!running) return;
  let moved=false, totalGained=0;
  const prev=JSON.stringify(grid);
  const newGrid=grid.map(r=>[...r]);

  for(let r=0;r<4;r++) {
    let row;
    if(dir==='left')  row=newGrid[r];
    else if(dir==='right') row=[...newGrid[r]].reverse();
    else if(dir==='up')    row=[0,1,2,3].map(c=>newGrid[c][r]);
    else                   row=[0,1,2,3].map(c=>newGrid[c][r]).reverse();

    const {arr,gained}=slide(row);
    totalGained+=gained;

    if(dir==='left')  newGrid[r]=arr;
    else if(dir==='right'){arr.reverse();newGrid[r]=arr;}
    else if(dir==='up')   [0,1,2,3].forEach((c,i)=>newGrid[c][r]=arr[i]);
    else{arr.reverse();[0,1,2,3].forEach((c,i)=>newGrid[c][r]=arr[i]);}
  }

  if(JSON.stringify(newGrid)!==prev) {
    moved=true;
    grid=newGrid;
    score+=totalGained;
    if(score>best){best=score;localStorage.setItem('2048best',best);}
    document.getElementById('sc').textContent=score;
    document.getElementById('be').textContent=best;

    const newCell=addTile();
    render(newCell);

    if(!won&&grid.some(r=>r.includes(2048))){
      won=true;
      document.getElementById('winSc').textContent=score;
      document.getElementById('winOv').classList.add('show');
    } else if(!canMove()){
      document.getElementById('overSc').textContent=score;
      document.getElementById('overOv').classList.add('show');
      running=false;
    }
  }
}

function canMove() {
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
    if(grid[r][c]===0) return true;
    if(c<3&&grid[r][c]===grid[r][c+1]) return true;
    if(r<3&&grid[r][c]===grid[r+1][c]) return true;
  }
  return false;
}

function render(newCell) {
  const board=document.getElementById('board');
  board.innerHTML='';
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
    const v=grid[r][c];
    const cell=document.createElement('div');
    cell.className='cell';
    const isNew=newCell&&newCell[0]===r&&newCell[1]===c;
    if(v>0) {
      const [stroke,fill,fs]=TILE_COLORS[Math.min(v,2048)]||['#ffffff','rgba(255,255,255,0.1)','10px'];
      cell.style.cssText=`background:${fill};border-color:${stroke}40;box-shadow:0 0 16px ${stroke}30,inset 0 0 20px ${stroke}08;color:${stroke};font-size:${fs};text-shadow:0 0 14px ${stroke};`;
      cell.textContent=v;
      if(isNew) cell.classList.add('new');
    }
    board.appendChild(cell);
  }
}

document.addEventListener('keydown',e=>{
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
});

let tx0=0,ty0=0;
document.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>Math.abs(dy)?Math.abs(dx)>30:Math.abs(dy)>30)
    move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
});

init();
</script>
</body>
</html>
