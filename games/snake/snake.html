<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Neon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #020408;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  #bgCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.4;
  }

  .game-wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #00ff88, #00cfff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(0,255,136,0.5));
  }

  .stats-bar {
    display: flex;
    gap: 32px;
    align-items: center;
  }

  .stat-box {
    text-align: center;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(0,255,136,0.15);
    border-radius: 12px;
    padding: 10px 22px;
    min-width: 90px;
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(0,255,136,0.6);
    margin-bottom: 4px;
  }

  .stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #00ff88;
    text-shadow: 0 0 20px rgba(0,255,136,0.6);
  }

  #levelDisplay { color: #a855f7; text-shadow: 0 0 20px rgba(168,85,247,0.6); }
  #highScoreDisplay { color: #00cfff; text-shadow: 0 0 20px rgba(0,207,255,0.6); }

  .canvas-container {
    position: relative;
  }

  #gameCanvas {
    display: block;
    border-radius: 12px;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    backdrop-filter: blur(12px);
    background: rgba(2,4,8,0.85);
    transition: opacity 0.3s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }

  .overlay-sub {
    font-size: 15px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 32px;
    letter-spacing: 0.05em;
  }

  .overlay-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 900;
    color: #00ff88;
    text-shadow: 0 0 30px rgba(0,255,136,0.8);
    margin-bottom: 8px;
  }

  .overlay-best {
    font-size: 14px;
    color: #00cfff;
    margin-bottom: 36px;
    letter-spacing: 0.1em;
  }

  .btn-play {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #020408;
    background: linear-gradient(135deg, #00ff88, #00cfff);
    border: none;
    padding: 14px 44px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 0 30px rgba(0,255,136,0.4);
  }

  .btn-play:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 0 50px rgba(0,255,136,0.6);
  }

  #levelUpFlash {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(168,85,247,0.4), transparent 70%);
    transition: opacity 0.1s;
    z-index: 5;
  }

  .controls-hint {
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.08em;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    font-size: 11px;
  }

  .powerup-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.06em;
    height: 24px;
  }

  .powerup-active {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #FFD700;
    text-shadow: 0 0 10px rgba(255,215,0,0.6);
    animation: blink 0.8s ease-in-out infinite;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
  }

  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<div class="game-wrapper">
  <div class="title">🐍 SNAKE</div>

  <div class="stats-bar">
    <div class="stat-box">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="scoreDisplay">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Level</div>
      <div class="stat-value" id="levelDisplay">1</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Best</div>
      <div class="stat-value" id="highScoreDisplay">0</div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="480" height="480"></canvas>
    <div id="levelUpFlash"></div>

    <div class="overlay" id="startScreen">
      <div class="overlay-title" style="background:linear-gradient(90deg,#00ff88,#00cfff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">READY?</div>
      <div class="overlay-sub">Collect food · Dodge yourself · Survive</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:28px;line-height:1.8;text-align:center;">
        🟡 Golden food = 5x points<br>
        ⚡ Speed boost every 5 points<br>
        🌀 Level up every 10 points
      </div>
      <button class="btn-play" onclick="startGame()">START GAME</button>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
      <div class="overlay-title" style="color:#ff4466;text-shadow:0 0 30px rgba(255,68,102,0.6);">GAME OVER</div>
      <div class="overlay-sub">The snake has fallen</div>
      <div class="overlay-score" id="finalScore">0</div>
      <div class="overlay-best" id="finalBest">BEST: 0</div>
      <button class="btn-play" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="powerup-bar" id="powerupBar">NO ACTIVE POWERUP</div>

  <div class="controls-hint">
    <span><span class="key">↑</span></span>
    <span><span class="key">↓</span></span>
    <span><span class="key">←</span></span>
    <span><span class="key">→</span></span>
    <span style="margin-left:8px;">Arrow keys to move</span>
    <span style="margin-left:12px;"><span class="key" style="width:auto;padding:0 8px;">P</span> Pause</span>
  </div>
</div>

<script>
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
bgCanvas.width = window.innerWidth;
bgCanvas.height = window.innerHeight;

const bgStars = Array.from({length: 80}, () => ({
  x: Math.random() * bgCanvas.width,
  y: Math.random() * bgCanvas.height,
  r: Math.random() * 1.5 + 0.3,
  speed: Math.random() * 0.3 + 0.05,
  pulse: Math.random() * Math.PI * 2
}));

function drawBg(t) {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  bgStars.forEach(s => {
    s.pulse += 0.02;
    const alpha = 0.15 + Math.sin(s.pulse) * 0.1;
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(0,255,136,${alpha})`;
    bgCtx.fill();
    s.y += s.speed;
    if (s.y > bgCanvas.height) { s.y = 0; s.x = Math.random() * bgCanvas.width; }
  });
  requestAnimationFrame(drawBg);
}
drawBg(0);

const CELL = 24;
const COLS = 20;
const ROWS = 20;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let snake, dx, dy, ndx, ndy, food, goldenFood, particles, score, highScore, level, paused, running, goldenTimer, speedBoost;
highScore = parseInt(localStorage.getItem('snakeHS') || '0');
document.getElementById('highScoreDisplay').textContent = highScore;

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
    const speed = Math.random() * 4 + 2;
    particles.push({
      x: x + CELL / 2, y: y + CELL / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1, decay: Math.random() * 0.04 + 0.02,
      size: Math.random() * 5 + 2,
      color
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.vy += 0.1;
    p.life -= p.decay;
  });
}

function drawParticles() {
  particles.forEach(p => {
    const radius = Math.max(0.1, p.size * p.life);
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.shadowBlur = 12;
    ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function randomCell() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS) * CELL, y: Math.floor(Math.random() * ROWS) * CELL };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(0,255,136,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(COLS * CELL, j * CELL); ctx.stroke();
  }
}

function drawSnake() {
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const t = i / snake.length;
    const r = Math.round(0 + t * 168);
    const g = Math.round(255 - t * 170);
    const b = Math.round(136 + t * 111);
    const color = `rgb(${r},${g},${b})`;

    ctx.save();
    ctx.shadowBlur = isHead ? 24 : 10;
    ctx.shadowColor = isHead ? '#00ffcc' : color;

    const grad = ctx.createLinearGradient(seg.x, seg.y, seg.x + CELL, seg.y + CELL);
    grad.addColorStop(0, isHead ? '#00ffcc' : color);
    grad.addColorStop(1, isHead ? '#00ff88' : `rgba(${r},${g},${b},0.7)`);
    ctx.fillStyle = grad;

    const pad = isHead ? 1 : 2;
    roundRect(seg.x + pad, seg.y + pad, CELL - pad * 2, CELL - pad * 2, isHead ? 6 : 4);
    ctx.fill();

    if (isHead) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#020408';
      const eyeOffset = dx !== 0 ? { x: dx > 0 ? 14 : 6, y: [5, 14] } : { x: [5, 14], y: dy > 0 ? 14 : 6 };
      if (dx !== 0) {
        ctx.fillRect(seg.x + eyeOffset.x - 2, seg.y + eyeOffset.y[0] - 2, 5, 5);
        ctx.fillRect(seg.x + eyeOffset.x - 2, seg.y + eyeOffset.y[1] - 2, 5, 5);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(seg.x + eyeOffset.x - 1, seg.y + eyeOffset.y[0] - 1, 3, 3);
        ctx.fillRect(seg.x + eyeOffset.x - 1, seg.y + eyeOffset.y[1] - 1, 3, 3);
      } else {
        ctx.fillRect(seg.x + eyeOffset.x[0] - 2, seg.y + eyeOffset.y - 2, 5, 5);
        ctx.fillRect(seg.x + eyeOffset.x[1] - 2, seg.y + eyeOffset.y - 2, 5, 5);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(seg.x + eyeOffset.x[0] - 1, seg.y + eyeOffset.y - 1, 3, 3);
        ctx.fillRect(seg.x + eyeOffset.x[1] - 1, seg.y + eyeOffset.y - 1, 3, 3);
      }
    }

    ctx.restore();

    if (!isHead) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(seg.x + pad + 2, seg.y + pad + 2, CELL - pad * 2 - 8, 3);
      ctx.restore();
    }
  });
}

let foodPulse = 0;
function drawFood() {
  foodPulse += 0.08;
  const pulse = Math.sin(foodPulse) * 0.15 + 0.85;

  ctx.save();
  ctx.shadowBlur = 20 + Math.sin(foodPulse) * 8;
  ctx.shadowColor = '#ff4466';
  const fg = ctx.createRadialGradient(
    food.x + CELL/2 - 3, food.y + CELL/2 - 3, 2,
    food.x + CELL/2, food.y + CELL/2, CELL/2 * pulse
  );
  fg.addColorStop(0, '#ffaaaa');
  fg.addColorStop(0.5, '#ff4466');
  fg.addColorStop(1, '#aa0022');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.arc(food.x + CELL/2, food.y + CELL/2, CELL/2 * pulse - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(food.x + CELL/2 - 3, food.y + CELL/2 - 3, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (goldenFood) {
    const gp = Math.sin(foodPulse * 2) * 0.2 + 0.9;
    ctx.save();
    ctx.shadowBlur = 30 + Math.sin(foodPulse * 2) * 10;
    ctx.shadowColor = '#FFD700';
    const gg = ctx.createRadialGradient(
      goldenFood.x + CELL/2 - 2, goldenFood.y + CELL/2 - 2, 1,
      goldenFood.x + CELL/2, goldenFood.y + CELL/2, CELL/2 * gp
    );
    gg.addColorStop(0, '#fffaaa');
    gg.addColorStop(0.4, '#FFD700');
    gg.addColorStop(1, '#cc8800');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(goldenFood.x + CELL/2, goldenFood.y + CELL/2, CELL/2 * gp - 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#fff';
    ctx.font = `${14 * gp}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', goldenFood.x + CELL/2, goldenFood.y + CELL/2);
    ctx.restore();
  }
}

function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, COLS * CELL, ROWS * CELL);
  bg.addColorStop(0, '#020610');
  bg.addColorStop(1, '#050214');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);

  ctx.save();
  ctx.strokeStyle = `rgba(0,255,136,${0.3 + Math.sin(Date.now() * 0.002) * 0.1})`;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#00ff88';
  roundRect(1, 1, COLS * CELL - 2, ROWS * CELL - 2, 10);
  ctx.stroke();
  ctx.restore();
}

function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHS', highScore);
    document.getElementById('highScoreDisplay').textContent = highScore;
  }
}

let levelFlashTimeout;
function triggerLevelUp() {
  const flash = document.getElementById('levelUpFlash');
  flash.style.opacity = '1';
  clearTimeout(levelFlashTimeout);
  levelFlashTimeout = setTimeout(() => { flash.style.opacity = '0'; }, 400);
  spawnParticles(
    Math.floor(Math.random() * COLS) * CELL,
    Math.floor(Math.random() * ROWS) * CELL,
    '#a855f7', 20
  );
}

let lastTime = 0;
let frameInterval = 120;

function gameLoop(timestamp) {
  if (!running) return;
  if (paused) { requestAnimationFrame(gameLoop); return; }

  if (timestamp - lastTime < frameInterval) {
    requestAnimationFrame(gameLoop);
    return;
  }
  lastTime = timestamp;

  dx = ndx; dy = ndy;

  let head = { x: snake[0].x + dx, y: snake[0].y + dy };

  if (head.x < 0) head.x = (COLS - 1) * CELL;
  else if (head.x >= COLS * CELL) head.x = 0;
  if (head.y < 0) head.y = (ROWS - 1) * CELL;
  else if (head.y >= ROWS * CELL) head.y = 0;

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame(); return;
  }

  snake.unshift(head);

  let ate = false;

  if (head.x === food.x && head.y === food.y) {
    ate = true;
    const pts = speedBoost ? 2 : 1;
    score += pts;
    spawnParticles(food.x, food.y, '#ff4466', 14);
    food = randomCell();

    if (!goldenFood && Math.random() < 0.2) {
      goldenFood = randomCell();
      goldenTimer = setTimeout(() => { goldenFood = null; }, 6000);
    }
  }

  if (goldenFood && head.x === goldenFood.x && head.y === goldenFood.y) {
    ate = true;
    score += 5;
    clearTimeout(goldenTimer);
    spawnParticles(goldenFood.x, goldenFood.y, '#FFD700', 24);
    goldenFood = null;
    speedBoost = true;
    frameInterval = Math.max(55, frameInterval - 10);
    document.getElementById('powerupBar').innerHTML = `<span class="powerup-active">⚡ SPEED BOOST ACTIVE!</span>`;
    clearTimeout(speedBoostTimeout);
    speedBoostTimeout = setTimeout(() => {
      speedBoost = false;
      document.getElementById('powerupBar').textContent = 'NO ACTIVE POWERUP';
    }, 4000);
  }

  if (!ate) snake.pop();

  const newLevel = Math.floor(score / 10) + 1;
  if (newLevel > level) {
    level = newLevel;
    frameInterval = Math.max(55, 120 - (level - 1) * 8);
    triggerLevelUp();
  }

  updateHUD();
  updateParticles();

  drawBackground();
  drawGrid();
  drawParticles();
  drawFood();
  drawSnake();

  requestAnimationFrame(gameLoop);
}

let speedBoostTimeout;

document.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    return;
  }
  if (!running) return;

  if (e.key === 'ArrowUp' && dy === 0)    { ndx = 0;    ndy = -CELL; e.preventDefault(); }
  if (e.key === 'ArrowDown' && dy === 0)  { ndx = 0;    ndy =  CELL; e.preventDefault(); }
  if (e.key === 'ArrowLeft' && dx === 0)  { ndx = -CELL; ndy = 0;   e.preventDefault(); }
  if (e.key === 'ArrowRight' && dx === 0) { ndx =  CELL; ndy = 0;   e.preventDefault(); }
});

function startGame() {
  snake = [
    { x: 10 * CELL, y: 10 * CELL },
    { x: 9  * CELL, y: 10 * CELL },
    { x: 8  * CELL, y: 10 * CELL },
  ];
  dx = CELL; dy = 0;
  ndx = CELL; ndy = 0;
  food = randomCell();
  goldenFood = null;
  particles = [];
  score = 0;
  level = 1;
  paused = false;
  running = true;
  speedBoost = false;
  frameInterval = 120;
  clearTimeout(goldenTimer);
  clearTimeout(speedBoostTimeout);
  document.getElementById('powerupBar').textContent = 'NO ACTIVE POWERUP';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  updateHUD();
  requestAnimationFrame(gameLoop);
}

function endGame() {
  running = false;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = `BEST: ${highScore}`;
  snake.forEach((seg, i) => {
    if (i % 3 === 0) spawnParticles(seg.x, seg.y, '#ff4466', 6);
  });
  drawBackground();
  drawGrid();
  drawParticles();
  setTimeout(() => {
    document.getElementById('gameOverScreen').classList.remove('hidden');
  }, 300);
}

drawBackground();
drawGrid();
</script>

</body>
</html>
