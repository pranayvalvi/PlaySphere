<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Runner — Neon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#030508;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Rajdhani',sans-serif;color:#fff;overflow:hidden;user-select:none;}
.title{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;letter-spacing:5px;background:linear-gradient(90deg,#00cfff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;}
.hud{display:flex;gap:24px;margin-bottom:8px;}
.hud-pill{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:8px 20px;text-align:center;}
.hud-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.3);}
.hud-val{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;}
.canvas-wrap{position:relative;}
canvas{border-radius:14px;box-shadow:0 0 40px rgba(0,0,0,0.8),0 0 0 1px rgba(0,207,255,0.1);display:block;}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,5,8,0.88);backdrop-filter:blur(12px);border-radius:14px;z-index:10;}
.ov-title{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;margin-bottom:8px;}
.ov-sub{font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:28px;text-align:center;line-height:1.7;}
.ov-score{font-family:'Orbitron',sans-serif;font-size:52px;font-weight:900;color:#00cfff;text-shadow:0 0 30px rgba(0,207,255,0.6);margin-bottom:4px;}
.ov-best{font-size:13px;color:#ffd700;margin-bottom:28px;}
.btn{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.15em;color:#030508;background:linear-gradient(135deg,#00cfff,#a855f7);border:none;padding:12px 40px;border-radius:50px;cursor:pointer;transition:all 0.25s;box-shadow:0 0 25px rgba(0,207,255,0.3);}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(0,207,255,0.5);}
</style>
</head>
<body>
<div class="title">🏃 ENDLESS RUNNER</div>
<div class="hud">
  <div class="hud-pill"><div class="hud-label">Score</div><div class="hud-val" id="sc" style="color:#00cfff;text-shadow:0 0 12px rgba(0,207,255,0.5)">0</div></div>
  <div class="hud-pill"><div class="hud-label">Speed</div><div class="hud-val" id="sp" style="color:#ff6b9d;text-shadow:0 0 12px rgba(255,107,157,0.5)">1x</div></div>
  <div class="hud-pill"><div class="hud-label">Best</div><div class="hud-val" id="be" style="color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,0.5)">0</div></div>
</div>
<div class="canvas-wrap">
  <canvas id="c" width="620" height="220"></canvas>
  <div class="overlay" id="startOv">
    <div class="ov-title" style="background:linear-gradient(90deg,#00cfff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">ENDLESS RUNNER</div>
    <div class="ov-sub">Press SPACE or tap to jump!<br>Double-tap for double jump 🚀</div>
    <button class="btn" onclick="startGame()">RUN</button>
  </div>
  <div class="overlay" id="overOv" style="display:none;">
    <div class="ov-title" style="color:#ff4466;text-shadow:0 0 30px rgba(255,68,102,0.5);">WIPED OUT!</div>
    <div class="ov-score" id="overSc">0</div>
    <div class="ov-best" id="overBest">Best: 0</div>
    <button class="btn" onclick="startGame()">RUN AGAIN</button>
  </div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const GND=H-30;
let runner,obstacles,particles,coins,score,best,running,animId,speed,frameCount;
best=parseInt(localStorage.getItem('runnerBest')||'0');
document.getElementById('be').textContent=best;

function startGame(){
  document.getElementById('startOv').style.display='none';
  document.getElementById('overOv').style.display='none';
  runner={x:60,y:GND,vy:0,w:28,h:36,jumps:0,maxJumps:2,frame:0,trail:[]};
  obstacles=[];coins=[];particles=[];score=0;frameCount=0;speed=3;running=true;
  if(animId)cancelAnimationFrame(animId);
  loop();
}

function jump(){
  if(!running)return;
  if(runner.jumps<runner.maxJumps){
    runner.vy=runner.jumps===0?-9.5:-8;
    runner.jumps++;
    spawnParticles(runner.x+runner.w/2,runner.y+runner.h,'#00cfff',8);
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});
c.addEventListener('click',jump);
c.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});

function spawnParticles(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*3.5+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,decay:0.04+Math.random()*0.03,color,size:Math.random()*3+1});
  }
}

function loop(){if(!running)return;update();draw();animId=requestAnimationFrame(loop);}

function update(){
  frameCount++;
  speed=3+Math.floor(score/200)*0.5;
  document.getElementById('sp').textContent=(speed/3).toFixed(1)+'x';

  runner.vy+=0.5;runner.y+=runner.vy;
  if(runner.y>=GND){runner.y=GND;runner.vy=0;runner.jumps=0;}
  runner.frame++;

  runner.trail.push({x:runner.x+runner.w/2,y:runner.y+runner.h/2});
  if(runner.trail.length>10)runner.trail.shift();

  score++;document.getElementById('sc').textContent=score;

  if(frameCount%Math.max(40,90-Math.floor(score/100)*3)===0){
    const types=['low','high','double'];
    const type=types[Math.floor(Math.random()*Math.min(3,1+Math.floor(score/300)))];
    if(type==='low')obstacles.push({x:W,y:GND,w:24,h:36+Math.random()*24,type:'cactus'});
    else if(type==='high')obstacles.push({x:W,y:GND-60,w:28,h:20,type:'bird'});
    else{obstacles.push({x:W,y:GND,w:20,h:40,type:'cactus'});obstacles.push({x:W+50,y:GND,w:20,h:30,type:'cactus'});}
  }

  if(frameCount%60===30)coins.push({x:W,y:GND-40-Math.random()*60,r:8,collected:false});

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.x-=speed;
    if(runner.x+runner.w-6>o.x&&runner.x+6<o.x+o.w&&runner.y+runner.h-4>o.y&&runner.y<o.y+o.h){
      endGame();return;
    }
    if(o.x+o.w<0)obstacles.splice(i,1);
  }

  for(let i=coins.length-1;i>=0;i--){
    const co=coins[i];co.x-=speed;
    if(!co.collected&&runner.x+runner.w>co.x-co.r&&runner.x<co.x+co.r&&runner.y+runner.h>co.y-co.r&&runner.y<co.y+co.r){
      co.collected=true;score+=50;spawnParticles(co.x,co.y,'#ffd700',12);
    }
    if(co.x+co.r<0)coins.splice(i,1);
  }

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.vx*=0.94;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#03050f');bg.addColorStop(1,'#06091a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,0.3)';
  for(let i=0;i<30;i++){const sx=(i*137+frameCount*0.3)%W,sy=(i*79)%(H-40);ctx.fillRect(sx,sy,1,1);}

  ctx.save();ctx.shadowBlur=8;ctx.shadowColor='#00cfff';
  ctx.fillStyle='rgba(0,207,255,0.15)';ctx.fillRect(0,GND+runner.h,W,4);
  ctx.strokeStyle='rgba(0,207,255,0.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,GND+runner.h);ctx.lineTo(W,GND+runner.h);ctx.stroke();
  ctx.restore();

  for(let x=(frameCount*speed)%60;x<W;x+=60){
    ctx.strokeStyle='rgba(0,207,255,0.06)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,GND+runner.h);ctx.lineTo(x,H);ctx.stroke();
  }

  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life;ctx.shadowBlur=8;ctx.shadowColor=p.color;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore();
  });

  runner.trail.forEach((pt,i)=>{
    ctx.save();ctx.globalAlpha=(i/runner.trail.length)*0.3;ctx.shadowBlur=6;ctx.shadowColor='#00cfff';
    ctx.fillStyle='#00cfff';ctx.beginPath();ctx.ellipse(pt.x,pt.y,6*(i/runner.trail.length),3*(i/runner.trail.length),0,0,Math.PI*2);ctx.fill();ctx.restore();
  });

  ctx.save();ctx.shadowBlur=16;ctx.shadowColor='#00cfff';
  const legOff=Math.sin(runner.frame*0.35)*8*(runner.y>=GND?1:0.3);
  ctx.strokeStyle='#00cfff';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(runner.x+8,runner.y+runner.h-8);ctx.lineTo(runner.x+4,runner.y+runner.h+legOff);ctx.stroke();
  ctx.beginPath();ctx.moveTo(runner.x+18,runner.y+runner.h-8);ctx.lineTo(runner.x+22,runner.y+runner.h-legOff);ctx.stroke();
  ctx.fillStyle='rgba(0,207,255,0.15)';ctx.strokeStyle='#00cfff';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(runner.x,runner.y,runner.w,runner.h-8,6);ctx.fill();ctx.stroke();
  ctx.shadowBlur=20;ctx.fillStyle='rgba(0,207,255,0.2)';ctx.strokeStyle='#00cfff';
  ctx.beginPath();ctx.arc(runner.x+runner.w/2,runner.y-10,12,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#00cfff';ctx.beginPath();ctx.arc(runner.x+runner.w/2+5,runner.y-12,3,0,Math.PI*2);ctx.fill();
  const armSwing=Math.sin(runner.frame*0.35)*10*(runner.y>=GND?1:0.3);
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(runner.x+4,runner.y+8);ctx.lineTo(runner.x-6,runner.y+16+armSwing);ctx.stroke();
  ctx.beginPath();ctx.moveTo(runner.x+runner.w-4,runner.y+8);ctx.lineTo(runner.x+runner.w+6,runner.y+16-armSwing);ctx.stroke();
  ctx.restore();

  obstacles.forEach(o=>{
    ctx.save();ctx.shadowBlur=14;
    if(o.type==='cactus'){
      ctx.shadowColor='#ff4466';ctx.fillStyle='rgba(255,68,102,0.15)';ctx.strokeStyle='#ff4466';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(o.x,o.y-o.h,o.w,o.h,4);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ff4466';
      [[o.x+3,o.y-o.h-10],[o.x+o.w-5,o.y-o.h-7],[o.x+o.w/2,o.y-o.h-14]].forEach(([sx,sy])=>{
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+4,sy+12);ctx.lineTo(sx-4,sy+12);ctx.closePath();ctx.fill();
      });
    } else {
      ctx.shadowColor='#a855f7';ctx.fillStyle='rgba(168,85,247,0.15)';ctx.strokeStyle='#a855f7';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      const wingY=Math.sin(frameCount*0.2)*8;
      ctx.beginPath();ctx.moveTo(o.x,o.y+o.h/2);ctx.lineTo(o.x-20,o.y+wingY);ctx.lineTo(o.x,o.y+o.h/2+4);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(o.x+o.w,o.y+o.h/2);ctx.lineTo(o.x+o.w+20,o.y+wingY);ctx.lineTo(o.x+o.w,o.y+o.h/2+4);ctx.closePath();ctx.fill();
    }
    ctx.restore();
  });

  coins.forEach(co=>{
    if(co.collected)return;
    ctx.save();ctx.shadowBlur=16;ctx.shadowColor='#ffd700';
    ctx.fillStyle='rgba(255,215,0,0.2)';ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(co.x,co.y,co.r,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd700';ctx.font='bold 9px Orbitron';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('$',co.x,co.y);
    ctx.restore();
  });
}

function endGame(){
  running=false;
  spawnParticles(runner.x+runner.w/2,runner.y+runner.h/2,'#ff4466',30);
  draw();
  if(score>best){best=score;localStorage.setItem('runnerBest',best);}
  document.getElementById('be').textContent=best;
  document.getElementById('overSc').textContent=score;
  document.getElementById('overBest').textContent=score>=best?'🏆 New Best!':'Best: '+best;
  setTimeout(()=>document.getElementById('overOv').style.display='flex',600);
}
</script>
</body>
</html>
