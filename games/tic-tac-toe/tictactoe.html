<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe — Neon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
background: #030508;
color: #fff;
font-family: 'Rajdhani', sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
overflow: hidden;
user-select: none;
}

#bgCanvas {
position: fixed;
inset: 0;
z-index: 0;
}

.game-wrapper {
position: relative;
z-index: 10;
display: flex;
flex-direction: column;
align-items: center;
gap: 20px;
}

.title {
font-family: 'Orbitron', sans-serif;
font-size: 32px;
font-weight: 900;
letter-spacing: 8px;
text-transform: uppercase;
background: linear-gradient(90deg, #00cfff, #a855f7, #ff6b9d);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
filter: drop-shadow(0 0 18px rgba(0,207,255,0.4));
}

.mode-row {
display: flex;
gap: 10px;
}

.mode-btn {
font-family: 'Orbitron', sans-serif;
font-size: 11px;
font-weight: 700;
letter-spacing: 0.1em;
padding: 8px 20px;
border-radius: 50px;
border: 1px solid rgba(255,255,255,0.12);
background: rgba(255,255,255,0.04);
color: rgba(255,255,255,0.4);
cursor: pointer;
transition: all 0.2s;
}

.mode-btn.active {
background: rgba(168,85,247,0.18);
border-color: rgba(168,85,247,0.5);
color: #c084fc;
box-shadow: 0 0 18px rgba(168,85,247,0.25);
}

.score-bar {
display: flex;
gap: 6px;
align-items: center;
}

.score-card {
text-align: center;
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.07);
border-radius: 14px;
padding: 12px 24px;
min-width: 80px;
transition: all 0.3s;
position: relative;
overflow: hidden;
}

.score-card.active-turn::after {
content: '';
position: absolute;
bottom: 0; left: 0; right: 0;
height: 2px;
animation: pulse-bar 1s ease-in-out infinite;
}

.score-card.x-card.active-turn::after { background: #00cfff; box-shadow: 0 0 8px #00cfff; }
.score-card.o-card.active-turn::after { background: #ff6b9d; box-shadow: 0 0 8px #ff6b9d; }

@keyframes pulse-bar {
0%,100% { opacity:1; } 50% { opacity:0.3; }
}

.score-label {
font-size: 10px;
letter-spacing: 0.18em;
text-transform: uppercase;
color: rgba(255,255,255,0.3);
margin-bottom: 4px;
}

.score-val {
font-family: 'Orbitron', sans-serif;
font-size: 26px;
font-weight: 900;
}

.score-card.x-card .score-val { color: #00cfff; text-shadow: 0 0 20px rgba(0,207,255,0.5); }
.score-card.o-card .score-val { color: #ff6b9d; text-shadow: 0 0 20px rgba(255,107,157,0.5); }

.score-divider {
font-family: 'Orbitron', sans-serif;
font-size: 22px;
color: rgba(255,255,255,0.1);
padding: 0 4px;
}

.status-box {
font-family: 'Orbitron', sans-serif;
font-size: 13px;
letter-spacing: 0.12em;
padding: 10px 28px;
border-radius: 50px;
border: 1px solid rgba(255,255,255,0.08);
background: rgba(255,255,255,0.03);
transition: all 0.4s;
text-align: center;
min-width: 260px;
}

.board-container {
position: relative;
}

.board {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
padding: 14px;
background: rgba(255,255,255,0.025);
border: 1px solid rgba(255,255,255,0.07);
border-radius: 20px;
backdrop-filter: blur(10px);
position: relative;
}

.cell {
width: 120px;
height: 120px;
border-radius: 16px;
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.07);
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
position: relative;
overflow: hidden;
}

.cell:not(.x-cell):not(.o-cell):hover {
border-color: rgba(255,255,255,0.18);
background: rgba(255,255,255,0.06);
transform: scale(1.04);
}

.cell.x-cell { border-color: rgba(0,207,255,0.35); box-shadow: inset 0 0 20px rgba(0,207,255,0.06); }
.cell.o-cell { border-color: rgba(255,107,157,0.35); box-shadow: inset 0 0 20px rgba(255,107,157,0.06); }
.cell.winning { animation: winPulse 0.6s ease forwards; }

@keyframes winPulse {
0% { transform: scale(1); }
40% { transform: scale(1.12); }
70% { transform: scale(0.96); }
100% { transform: scale(1.06); }
}

.cell svg { width: 64px; height: 64px; overflow: visible; }

#winLineCanvas {
position: absolute;
inset: 0;
border-radius: 20px;
pointer-events: none;
}

.restart-btn {
font-family: 'Orbitron', sans-serif;
font-size: 12px;
font-weight: 700;
letter-spacing: 0.15em;
text-transform: uppercase;
color: #030508;
background: linear-gradient(135deg, #00cfff, #a855f7);
border: none;
padding: 12px 36px;
border-radius: 50px;
cursor: pointer;
transition: all 0.25s;
box-shadow: 0 0 25px rgba(0,207,255,0.3);
}

.restart-btn:hover {
transform: translateY(-2px) scale(1.05);
box-shadow: 0 0 40px rgba(0,207,255,0.5);
}

#particleCanvas {
position: absolute;
inset: 0;
pointer-events: none;
border-radius: 20px;
}

.ai-thinking {
display: none;
align-items: center;
gap: 8px;
font-size: 12px;
color: rgba(168,85,247,0.7);
letter-spacing: 0.12em;
}

.ai-thinking.visible { display: flex; }

.think-dot {
width: 6px; height: 6px;
border-radius: 50%;
background: #a855f7;
animation: thinkBounce 0.6s ease-in-out infinite;
}

.think-dot:nth-child(2) { animation-delay: 0.15s; }
.think-dot:nth-child(3) { animation-delay: 0.3s; }

@keyframes thinkBounce {
0%,100% { transform: translateY(0); opacity:0.4; }
50% { transform: translateY(-5px); opacity:1; }
}
</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<div class="game-wrapper">
<div class="title">Tic·Tac·Toe</div>

<div class="mode-row">
<button class="mode-btn active" id="btnPvA" onclick="setMode('ai')">🤖 vs AI</button>
<button class="mode-btn" id="btnPvP" onclick="setMode('pvp')">👥 2 Players</button>
</div>

<div class="score-bar">
<div class="score-card x-card active-turn" id="xCard">
<div class="score-label" id="xLabel">YOU</div>
<div class="score-val" id="xScore">0</div>
</div>
<div class="score-divider">—</div>
<div class="score-card draw-card">
<div class="score-label">DRAWS</div>
<div class="score-val" id="drawScore" style="font-size:20px;color:rgba(255,255,255,0.35)">0</div>
</div>
<div class="score-divider">—</div>
<div class="score-card o-card" id="oCard">
<div class="score-label" id="oLabel">AI</div>
<div class="score-val" id="oScore">0</div>
</div>
</div>

<div class="status-box" id="statusBox" style="color:#00cfff">YOUR TURN — X</div>

<div class="board-container">
<div class="board" id="board">
<canvas id="winLineCanvas" width="392" height="392"></canvas>
<canvas id="particleCanvas" width="392" height="392"></canvas>
</div>
</div>

<div class="ai-thinking" id="aiThinking">
<div class="think-dot"></div>
<div class="think-dot"></div>
<div class="think-dot"></div>
<span>AI is thinking...</span>
</div>

<button class="restart-btn" onclick="resetGame()">↺ NEW GAME</button>
</div>

<script>
const bgC = document.getElementById('bgCanvas');
const bgX = bgC.getContext('2d');
bgC.width = window.innerWidth; bgC.height = window.innerHeight;
const bgParticles = Array.from({length:60}, () => ({
x: Math.random()*bgC.width, y: Math.random()*bgC.height,
vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3,
r: Math.random()*1.2+0.3, a: Math.random(),
col: ['rgba(0,207,255,', 'rgba(168,85,247,', 'rgba(255,107,157,'][Math.floor(Math.random()*3)]
}));

function drawBg() {
bgX.fillStyle = 'rgba(3,5,8,0.25)';
bgX.fillRect(0,0,bgC.width,bgC.height);
bgParticles.forEach(p => {
p.x += p.vx; p.y += p.vy; p.a += 0.008;
if(p.x<0||p.x>bgC.width) p.vx*=-1;
if(p.y<0||p.y>bgC.height) p.vy*=-1;
const alpha = 0.15 + Math.sin(p.a)*0.12;
bgX.beginPath(); bgX.arc(p.x,p.y,p.r,0,Math.PI*2);
bgX.fillStyle = p.col+alpha+')'; bgX.fill();
});
requestAnimationFrame(drawBg);
}
drawBg();

const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];

function spawnCelebration(cx, cy, color) {
for(let i=0;i<30;i++) {
const angle = Math.random()*Math.PI*2;
const speed = Math.random()*6+2;
particles.push({
x:cx, y:cy,
vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
life:1, decay:Math.random()*0.025+0.015,
size:Math.random()*5+2, color,
shape: Math.random()>0.5 ? 'circle' : 'rect'
});
}
}

function animateParticles() {
pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
particles = particles.filter(p=>p.life>0);
particles.forEach(p => {
p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.vx*=0.96; p.life-=p.decay;
pCtx.save();
pCtx.globalAlpha = p.life;
pCtx.shadowBlur = 8; pCtx.shadowColor = p.color;
pCtx.fillStyle = p.color;
if(p.shape==='circle') {
pCtx.beginPath(); pCtx.arc(p.x,p.y,Math.max(0.1,p.size*p.life),0,Math.PI*2); pCtx.fill();
} else {
pCtx.save(); pCtx.translate(p.x,p.y); pCtx.rotate(p.life*5);
pCtx.fillRect(-p.size/2,-p.size/2,p.size*p.life,p.size*p.life); pCtx.restore();
}
pCtx.restore();
});
requestAnimationFrame(animateParticles);
}
animateParticles();

const wlCanvas = document.getElementById('winLineCanvas');
const wlCtx = wlCanvas.getContext('2d');

function drawWinLine(combo, color) {
function cellCenter(idx) {
const col = idx % 3, row = Math.floor(idx/3);
const x = 14 + col*130 + 60;
const y = 14 + row*130 + 60;
return {x, y};
}

const start = cellCenter(combo[0]);
const end = cellCenter(combo[2]);

wlCtx.clearRect(0,0,wlCanvas.width,wlCanvas.height);

let progress = 0;
function animLine() {
progress = Math.min(1, progress + 0.07);
wlCtx.clearRect(0,0,wlCanvas.width,wlCanvas.height);
wlCtx.save();
wlCtx.strokeStyle = color;
wlCtx.lineWidth = 5;
wlCtx.lineCap = 'round';
wlCtx.shadowBlur = 20;
wlCtx.shadowColor = color;
wlCtx.globalAlpha = 0.9;
wlCtx.beginPath();
wlCtx.moveTo(start.x, start.y);
wlCtx.lineTo(start.x + (end.x - start.x)*progress, start.y + (end.y - start.y)*progress);
wlCtx.stroke();
wlCtx.restore();
if(progress < 1) requestAnimationFrame(animLine);
}
animLine();
}

const WIN_COMBOS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let board = Array(9).fill(null);
let currentPlayer = 'X';
let gameActive = true;
let mode = 'ai';
let scores = {X:0, O:0, D:0};
let cellEls = [];

function buildBoard() {
const boardEl = document.getElementById('board');
cellEls = [];
Array.from(boardEl.querySelectorAll('.cell')).forEach(c=>c.remove());

for(let i=0;i<9;i++) {
const cell = document.createElement('div');
cell.className = 'cell';
cell.dataset.index = i;
cell.addEventListener('click', () => handleClick(i));
boardEl.appendChild(cell);
cellEls.push(cell);
}
boardEl.appendChild(wlCanvas);
boardEl.appendChild(pCanvas);
}

function renderSymbol(cellEl, player, animate=true) {
cellEl.innerHTML = '';
const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.setAttribute('viewBox','0 0 64 64');

if(player === 'X') {
cellEl.classList.add('x-cell');
const line1 = document.createElementNS('http://www.w3.org/2000/svg','line');
line1.setAttribute('x1','12'); line1.setAttribute('y1','12');
line1.setAttribute('x2','52'); line1.setAttribute('y2','52');
line1.setAttribute('stroke','#00cfff'); line1.setAttribute('stroke-width','6');
line1.setAttribute('stroke-linecap','round');

const line2 = document.createElementNS('http://www.w3.org/2000/svg','line');
line2.setAttribute('x1','52'); line2.setAttribute('y1','12');
line2.setAttribute('x2','12'); line2.setAttribute('y2','52');
line2.setAttribute('stroke','#00cfff'); line2.setAttribute('stroke-width','6');
line2.setAttribute('stroke-linecap','round');

if(animate) {
[line1,line2].forEach((l,i) => {
const len = 57;
l.style.strokeDasharray = len;
l.style.strokeDashoffset = len;
l.style.filter = 'drop-shadow(0 0 8px #00cfff)';
l.style.transition = `stroke-dashoffset 0.25s ease ${i*0.12}s`;
setTimeout(()=>{ l.style.strokeDashoffset = '0'; }, 10);
});
}
svg.appendChild(line1); svg.appendChild(line2);
} else {
cellEl.classList.add('o-cell');
const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
circle.setAttribute('cx','32'); circle.setAttribute('cy','32'); circle.setAttribute('r','20');
circle.setAttribute('stroke','#ff6b9d'); circle.setAttribute('stroke-width','6');
circle.setAttribute('fill','none');
circle.setAttribute('stroke-linecap','round');

if(animate) {
const circ = 2*Math.PI*20;
circle.style.strokeDasharray = circ;
circle.style.strokeDashoffset = circ;
circle.style.filter = 'drop-shadow(0 0 8px #ff6b9d)';
circle.style.transition = 'stroke-dashoffset 0.35s ease';
setTimeout(()=>{ circle.style.strokeDashoffset = '0'; }, 10);
}
svg.appendChild(circle);
}

cellEl.appendChild(svg);
if(animate) {
cellEl.style.transform = 'scale(0.7)';
cellEl.style.transition = 'transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';
setTimeout(()=>{ cellEl.style.transform = ''; }, 10);
}
}

function setStatus(text, color='#ffffff') {
const el = document.getElementById('statusBox');
el.style.color = color;
el.textContent = text;
}

function updateTurnCards() {
const xCard = document.getElementById('xCard');
const oCard = document.getElementById('oCard');
if(currentPlayer==='X' && gameActive) {
xCard.classList.add('active-turn'); oCard.classList.remove('active-turn');
} else if(currentPlayer==='O' && gameActive) {
oCard.classList.add('active-turn'); xCard.classList.remove('active-turn');
} else {
xCard.classList.remove('active-turn'); oCard.classList.remove('active-turn');
}
}

function checkWin(player) {
return WIN_COMBOS.find(combo => combo.every(i => board[i]===player)) || null;
}

function checkDraw() { return board.every(c=>c!==null); }

function handleClick(idx) {
if(!gameActive || board[idx] || (mode==='ai' && currentPlayer==='O')) return;
makeMove(idx, currentPlayer);
}

function makeMove(idx, player) {
board[idx] = player;
renderSymbol(cellEls[idx], player);

const winCombo = checkWin(player);
if(winCombo) {
endGame(player, winCombo);
return;
}
if(checkDraw()) {
endGame(null);
return;
}
currentPlayer = player==='X' ? 'O' : 'X';
updateTurnCards();

if(mode==='ai') {
if(currentPlayer==='O') {
setStatus('AI IS THINKING...', '#a855f7');
document.getElementById('aiThinking').classList.add('visible');
setTimeout(aiMove, 550);
} else {
setStatus('YOUR TURN — X', '#00cfff');
}
} else {
const col = currentPlayer==='X' ? '#00cfff' : '#ff6b9d';
setStatus(`PLAYER ${currentPlayer}'S TURN`, col);
}
}

function aiMove() {
document.getElementById('aiThinking').classList.remove('visible');
const best = minimax(board, 'O', true);
makeMove(best.index, 'O');
}

function minimax(boardState, player, isMaximizing, depth=0) {
const win = checkWinState(boardState, 'O');
const lose = checkWinState(boardState, 'X');
const full = boardState.every(c=>c!==null);
if(win) return {score: 10-depth};
if(lose) return {score: depth-10};
if(full) return {score:0};

const moves = [];
boardState.forEach((cell,i) => {
if(!cell) {
const newBoard = [...boardState];
newBoard[i] = player;
const result = minimax(newBoard, player==='O'?'X':'O', !isMaximizing, depth+1);
moves.push({index:i, score:result.score});
}
});

let best;
if(isMaximizing) {
let bestScore = -Infinity;
moves.forEach(m=>{ if(m.score>bestScore){bestScore=m.score;best=m;} });
} else {
let bestScore = Infinity;
moves.forEach(m=>{ if(m.score<bestScore){bestScore=m.score;best=m;} });
}
return best;
}

function checkWinState(b, player) {
return WIN_COMBOS.some(combo=>combo.every(i=>b[i]===player));
}

function endGame(winner, combo) {
gameActive = false;
updateTurnCards();
wlCtx.clearRect(0,0,wlCanvas.width,wlCanvas.height);

if(winner) {
scores[winner]++;
document.getElementById(winner==='X'?'xScore':'oScore').textContent = scores[winner];

const color = winner==='X' ? '#00cfff' : '#ff6b9d';
const label = mode==='ai' ? (winner==='X'?'YOU WIN! 🎉':'AI WINS! 🤖') : `PLAYER ${winner} WINS! 🎉`;
setStatus(label, color);

combo.forEach(i => cellEls[i].classList.add('winning'));
drawWinLine(combo, color);

combo.forEach(i => {
const col = i%3, row = Math.floor(i/3);
const cx = 14 + col*130 + 60;
const cy = 14 + row*130 + 60;
spawnCelebration(cx, cy, color);
});
} else {
scores.D++;
document.getElementById('drawScore').textContent = scores.D;
setStatus("IT'S A DRAW! 🤝", '#ffffff');
}
}

function resetGame() {
board = Array(9).fill(null);
currentPlayer = 'X';
gameActive = true;
wlCtx.clearRect(0,0,wlCanvas.width,wlCanvas.height);
particles = [];
pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
document.getElementById('aiThinking').classList.remove('visible');

cellEls.forEach(c => {
c.innerHTML = '';
c.className = 'cell';
c.style.transform = '';
});

updateTurnCards();
if(mode==='ai') setStatus('YOUR TURN — X', '#00cfff');
else setStatus("PLAYER X'S TURN", '#00cfff');
}

function setMode(m) {
mode = m;
document.getElementById('btnPvA').classList.toggle('active', m==='ai');
document.getElementById('btnPvP').classList.toggle('active', m==='pvp');
document.getElementById('oLabel').textContent = m==='ai' ? 'AI' : 'P2';
document.getElementById('xLabel').textContent = m==='ai' ? 'YOU' : 'P1';
scores = {X:0,O:0,D:0};
document.getElementById('xScore').textContent = '0';
document.getElementById('oScore').textContent = '0';
document.getElementById('drawScore').textContent = '0';
resetGame();
}

buildBoard();
setStatus('YOUR TURN — X', '#00cfff');
updateTurnCards();
</script>

</body>
</html>
