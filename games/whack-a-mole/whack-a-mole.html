<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole — Neon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#030508;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Rajdhani',sans-serif;color:#fff;overflow:hidden;user-select:none;cursor:none;}
.cursor-hammer{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;font-size:28px;transform:translate(-50%,-50%);transition:transform 0.05s;will-change:transform;}
.cursor-hammer.whack{transform:translate(-50%,-50%) rotate(-40deg) scale(1.3);}
.title{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;letter-spacing:5px;background:linear-gradient(90deg,#ffd700,#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;}
.hud{display:flex;gap:20px;margin-bottom:14px;}
.hud-pill{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:8px 20px;text-align:center;min-width:80px;}
.hud-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.3);}
.hud-val{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;}
.holes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:24px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,215,0,0.08);border-radius:24px;}
.hole-wrap{position:relative;width:110px;height:110px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
.hole{position:absolute;bottom:0;width:90px;height:22px;background:rgba(0,0,0,0.7);border-radius:50%;border:2px solid rgba(255,255,255,0.06);}
.mole{position:absolute;bottom:-80px;font-size:52px;transition:bottom 0.15s cubic-bezier(0.34,1.2,0.64,1);cursor:none;z-index:2;filter:drop-shadow(0 0 12px rgba(255,215,0,0.4));}
.mole.up{bottom:8px;}
.mole.whacked{animation:moleWhack 0.3s ease forwards;}
@keyframes moleWhack{0%{transform:scale(1);}40%{transform:scale(1.4) rotate(-20deg);}100%{transform:scale(0) rotate(40deg);opacity:0;}}
.score-pop{position:absolute;font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;pointer-events:none;animation:scorePop 0.7s ease forwards;z-index:10;}
@keyframes scorePop{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,5,8,0.9);backdrop-filter:blur(14px);z-index:100;}
.ov-title{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:900;margin-bottom:8px;}
.ov-sub{font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:28px;}
.ov-score{font-family:'Orbitron',sans-serif;font-size:52px;font-weight:900;color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,0.6);margin-bottom:8px;}
.btn{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.15em;color:#030508;background:linear-gradient(135deg,#ffd700,#ff9f43);border:none;padding:12px 40px;border-radius:50px;cursor:none;transition:all 0.25s;box-shadow:0 0 25px rgba(255,215,0,0.3);}
.diff-row{display:flex;gap:8px;margin-bottom:12px;}
.diff-btn{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;padding:7px 18px;border-radius:50px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.35);cursor:none;transition:all 0.2s;}
.diff-btn.active{background:rgba(255,215,0,0.15);border-color:rgba(255,215,0,0.4);color:#ffd700;}
</style>
</head>
<body>
<div class="cursor-hammer" id="hammer">🔨</div>
<div class="title">🦔 WHACK-A-MOLE</div>
<div class="diff-row">
  <button class="diff-btn active" onclick="setDiff('easy')">Easy</button>
  <button class="diff-btn" onclick="setDiff('normal')">Normal</button>
  <button class="diff-btn" onclick="setDiff('hard')">Hard</button>
</div>
<div class="hud">
  <div class="hud-pill"><div class="hud-label">Score</div><div class="hud-val" id="sc" style="color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,0.5)">0</div></div>
  <div class="hud-pill"><div class="hud-label">Hits</div><div class="hud-val" id="hi" style="color:#00ff88;text-shadow:0 0 12px rgba(0,255,136,0.5)">0</div></div>
  <div class="hud-pill"><div class="hud-label">Miss</div><div class="hud-val" id="mi" style="color:#ff4466;text-shadow:0 0 12px rgba(255,68,102,0.5)">0</div></div>
  <div class="hud-pill"><div class="hud-label">Time</div><div class="hud-val" id="ti" style="color:#a855f7;text-shadow:0 0 12px rgba(168,85,247,0.5)">30</div></div>
</div>
<div class="holes-grid" id="grid"></div>

<div class="overlay" id="startOv">
  <div class="ov-title" style="background:linear-gradient(90deg,#ffd700,#ff9f43);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">WHACK-A-MOLE</div>
  <div class="ov-sub">Click the moles before they hide! 30 seconds.</div>
  <button class="btn" onclick="startGame()" style="cursor:none">START</button>
</div>
<div class="overlay" id="overOv" style="display:none;">
  <div class="ov-title" style="color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,0.5);">TIME'S UP!</div>
  <div class="ov-score" id="overSc">0</div>
  <div style="font-size:14px;color:#00cfff;margin-bottom:28px;" id="overBest"></div>
  <button class="btn" onclick="startGame()" style="cursor:none">PLAY AGAIN</button>
</div>

<script>
const MOLES=['🦔','🐹','🦫','🐭','🐱'];
const DIFF={easy:{minTime:900,maxTime:1600,up:1100},normal:{minTime:600,maxTime:1100,up:800},hard:{minTime:350,maxTime:700,up:500}};
let diff='easy',score,hits,misses,timeLeft,running,holes,timers,timerInterval;
let best=parseInt(localStorage.getItem('wamBest')||'0');

const hammer=document.getElementById('hammer');
document.addEventListener('mousemove',e=>{hammer.style.left=e.clientX+'px';hammer.style.top=e.clientY+'px';});

function setDiff(d){
  diff=d;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===d));
}

function buildGrid(){
  const g=document.getElementById('grid');g.innerHTML='';holes=[];
  for(let i=0;i<9;i++){
    const wrap=document.createElement('div');wrap.className='hole-wrap';
    const hole=document.createElement('div');hole.className='hole';
    const mole=document.createElement('div');mole.className='mole';
    const emoji=MOLES[Math.floor(Math.random()*MOLES.length)];
    mole.textContent=emoji;mole.dataset.index=i;
    wrap.appendChild(hole);wrap.appendChild(mole);
    wrap.addEventListener('click',()=>whack(i,wrap));
    g.appendChild(wrap);
    holes.push({mole,up:false,timer:null});
  }
}

function startGame(){
  document.getElementById('startOv').style.display='none';
  document.getElementById('overOv').style.display='none';
  buildGrid();
  score=0;hits=0;misses=0;timeLeft=30;running=true;timers=[];
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;document.getElementById('ti').textContent=timeLeft;
    if(timeLeft<=0){clearInterval(timerInterval);endGame();}
  },1000);
  updateHUD();
  scheduleAll();
}

function scheduleAll(){
  holes.forEach((_,i)=>scheduleHole(i));
}

function scheduleHole(i){
  if(!running)return;
  const cfg=DIFF[diff];
  const delay=cfg.minTime+Math.random()*(cfg.maxTime-cfg.minTime);
  const t=setTimeout(()=>popUp(i),delay);
  if(holes[i])holes[i].timer=t;
}

function popUp(i){
  if(!running)return;
  const h=holes[i];if(!h)return;
  h.up=true;h.mole.classList.add('up');
  const cfg=DIFF[diff];
  const t=setTimeout(()=>popDown(i),cfg.up);
  h.upTimer=t;
}

function popDown(i,whacked=false){
  const h=holes[i];if(!h)return;
  if(!whacked&&h.up){misses++;updateHUD();}
  h.up=false;h.mole.classList.remove('up');
  if(!whacked)scheduleHole(i);
}

function whack(i,wrap){
  if(!running)return;
  const h=holes[i];if(!h||!h.up)return;
  clearTimeout(h.upTimer);
  h.up=false;h.mole.classList.add('whacked');
  score+=10;hits++;updateHUD();
  const pop=document.createElement('div');
  pop.className='score-pop';pop.textContent='+10';pop.style.color='#ffd700';pop.style.left='50%';pop.style.bottom='60px';pop.style.transform='translateX(-50%)';
  wrap.appendChild(pop);setTimeout(()=>pop.remove(),700);
  hammer.classList.add('whack');setTimeout(()=>hammer.classList.remove('whack'),200);
  setTimeout(()=>{h.mole.classList.remove('whacked');h.mole.classList.remove('up');scheduleHole(i);},300);
}

document.addEventListener('click',e=>{
  const onHole=e.target.closest('.hole-wrap');
  if(!onHole&&running){misses++;updateHUD();}
});

function updateHUD(){
  document.getElementById('sc').textContent=score;
  document.getElementById('hi').textContent=hits;
  document.getElementById('mi').textContent=misses;
}

function endGame(){
  running=false;
  holes.forEach(h=>{clearTimeout(h.timer);clearTimeout(h.upTimer);});
  if(score>best){best=score;localStorage.setItem('wamBest',best);}
  document.getElementById('overSc').textContent=score;
  document.getElementById('overBest').textContent=score>=best?'🏆 New Best!':'Best: '+best;
  setTimeout(()=>document.getElementById('overOv').style.display='flex',400);
}
</script>
</body>
</html>
